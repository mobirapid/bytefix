<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ReGear Admin</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
const API='/api';
let TOKEN=localStorage.getItem('regear_token')||'';
let tab='overview', adminCat=null, adminModel=null, data={}, commsTab='repair', commsStatus=null, accessQ='', accessTimer=null, showCities=false, auditQ='', auditTimer=null;
const INR=n=>'₹'+Number(Math.round(n||0)).toLocaleString('en-IN');
const esc=s=>String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;');
const catIco=x=>(x&&(x.emoji||'').startsWith('data:'))?'<img src="'+x.emoji+'" alt="" style="height:16px;width:auto;vertical-align:-3px;border-radius:3px">':((x&&x.emoji)||'');
function flash(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700);}

async function api(path,opts={}){
  const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},...opts});
  if(r.status===401){TOKEN='';localStorage.removeItem('regear_token');renderLogin();throw new Error('Session expired');}
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Request failed');
  return r.json();
}

const PAGES={
  overview:['Overview','Your store at a glance','◫'],
  catalog:['Catalog','Device types, brands & models','▦'],
  repair:['Repair pricing','Category defaults & per-model prices','✚'],
  resale:['Resale','Condition multipliers that set payouts','₹'],
  orders:['Orders','Repair & resale pipeline','▤'],
  corporate:['Corporate','B2B bulk sell & buy enquiries','◍'],
  comms:['Communications','Emails & messages sent for every order','✉'],
  access:['Access','Users, roles & permissions','◐'],
  audit:['Audit log','Record of admin & operator actions','▣'],
  settings:['Settings','Store configuration','⚙'],
};

/* ---------- LOGIN ---------- */
function renderLogin(msg){
  document.getElementById('root').innerHTML=`<div class="login"><div class="box">
    <div class="brand"><span class="dot"></span><div><b>ReGear</b><small>Admin console</small></div></div>
    <div class="card2"><h2>Sign in</h2><p>Manage catalog, pricing & orders</p>
      <label>Email</label><input id="le" value="admin@regear.in">
      <label>Password</label><input id="lp" type="password" value="admin123" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn ink" style="width:100%;margin-top:20px" onclick="doLogin()">Sign in</button>
      ${msg?`<p style="color:var(--amber);margin-top:13px;font-size:13px">${msg}</p>`:''}
      <div class="hint"><a style="color:var(--green-bright);cursor:pointer;font-weight:600" onclick="renderForgot()">Forgot password?</a></div>
    </div></div></div>`;
}
function renderForgot(prefill){
  document.getElementById('root').innerHTML=`<div class="login"><div class="box">
    <div class="brand"><span class="dot"></span><div><b>ReGear</b><small>Admin console</small></div></div>
    <div class="card2"><h2>Reset password</h2><p>We'll email a 6-digit code to your admin email.</p>
      <label>Admin email</label><input id="fe" value="${esc(prefill||'')}" placeholder="admin@yourdomain">
      <button class="btn ink" style="width:100%;margin-top:16px" onclick="sendReset()">Send code</button>
      <div id="fmsg" class="hint" style="min-height:14px"></div>
      <div class="hint"><a style="color:var(--green-bright);cursor:pointer;font-weight:600" onclick="renderLogin()">← Back to sign in</a></div>
    </div></div></div>`;
}
async function sendReset(){
  const email=document.getElementById('fe').value.trim();const m=document.getElementById('fmsg');
  if(!email){m.textContent='Enter your admin email.';return;}
  try{await fetch(API+'/auth/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    renderReset(email);}catch(e){m.textContent='Could not reach server.';}
}
function renderReset(email){
  document.getElementById('root').innerHTML=`<div class="login"><div class="box">
    <div class="brand"><span class="dot"></span><div><b>ReGear</b><small>Admin console</small></div></div>
    <div class="card2"><h2>Enter code</h2><p>If an admin account exists for <b>${esc(email)}</b>, a code has been emailed. Enter it with your new password.</p>
      <label>6-digit code</label><input id="rc" inputmode="numeric" maxlength="6" placeholder="––––––" style="letter-spacing:6px">
      <label>New password</label><input id="rp" type="password" placeholder="At least 6 characters" onkeydown="if(event.key==='Enter')doReset('${esc(email)}')">
      <button class="btn ink" style="width:100%;margin-top:16px" onclick="doReset('${esc(email)}')">Reset password</button>
      <div id="rmsg" class="hint" style="min-height:14px"></div>
      <div class="hint"><a style="color:var(--green-bright);cursor:pointer;font-weight:600" onclick="renderForgot('${esc(email)}')">← Resend / change email</a></div>
    </div></div></div>`;
}
async function doReset(email){
  const code=document.getElementById('rc').value.trim();const password=document.getElementById('rp').value;const m=document.getElementById('rmsg');
  if(code.length<4){m.textContent='Enter the code from your email.';return;}
  if(password.length<6){m.textContent='Password must be at least 6 characters.';return;}
  try{const r=await fetch(API+'/auth/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,code,password})});
    const d=await r.json();if(!r.ok){m.textContent=d.error||'Could not reset.';return;}
    renderLogin('Password updated — sign in with your new password.');
  }catch(e){m.textContent='Could not reach server.';}
}
async function doLogin(){
  try{
    const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('le').value,password:document.getElementById('lp').value})});
    if(!r.ok){renderLogin('Invalid email or password');return;}
    const d=await r.json();TOKEN=d.token;localStorage.setItem('regear_token',TOKEN);tab='overview';boot();
  }catch(e){renderLogin('Could not reach server. Run npm start.');}
}
function logout(){TOKEN='';localStorage.removeItem('regear_token');renderLogin();}

/* ---------- SHELL ---------- */
function shell(body){
  const order=['overview','catalog','repair','resale','orders','corporate','comms','access','audit','settings'];
  const city=(data.settings&&data.settings.city)||'Bengaluru';
  return `<div class="layout">
    <aside class="sidebar">
      <div class="brand"><span class="dot"></span><div><b>ReGear</b><small>Admin console</small></div></div>
      <nav class="nav">${order.map(k=>`<div class="navi ${tab===k?'on':''}" onclick="setTab('${k}')"><span class="ic">${PAGES[k][2]}</span>${PAGES[k][0]}</div>`).join('')}</nav>
      <div class="side-foot">
        <a href="/" class="navi"><span class="ic">↗</span>View store</a>
        <div class="navi" onclick="logout()"><span class="ic">⏻</span>Sign out</div>
        <div class="acct"><div class="av">A</div><div><b>admin@regear.in</b><small>Administrator</small></div></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><div class="ttl">${PAGES[tab][0]}</div><div class="ttl-sub">${PAGES[tab][1]}</div></div>
        <span class="chip-city">◷ ${esc(city)}</span>
      </header>
      <div id="screen" class="content">${body}</div>
    </main></div>`;
}
function setTab(t){tab=t;adminModel=null;boot();}
function render(body){document.getElementById('root').innerHTML=shell(body);}

async function boot(){
  if(!TOKEN){renderLogin();return;}
  try{
    if(!data.settings)data.settings=await api('/settings');
    if(!data.statuses)data.statuses=await api('/service/order-statuses');
    if(tab==='overview'){data.orders=await api('/orders');data.catalog=data.catalog||await api('/catalog');data.leads=await api('/corporate');render(overviewView());}
    else if(tab==='catalog'){data.catalog=await api('/catalog');if(!adminCat&&data.catalog[0])adminCat=data.catalog[0].id;render(catalogView());}
    else if(tab==='repair'){data.catalog=data.catalog||await api('/catalog');if(!adminCat)adminCat=data.catalog[0].id;data.settings=await api('/settings');if(adminModel){data.modelIssues=await api('/models/'+adminModel+'/repair-issues');}else{data.issues=await api('/repair-issues?category_id='+adminCat);}render(repairView());}
    else if(tab==='resale'){data.conditions=await api('/conditions');render(resaleView());}
    else if(tab==='orders'){data.orders=await api('/orders');render(ordersView());}
    else if(tab==='corporate'){data.leads=await api('/corporate');render(corporateView());}
    else if(tab==='comms'){data.templates=await api('/order-templates');data.settings=await api('/settings');data.statuses=await api('/service/order-statuses');render(commsView());}
    else if(tab==='access'){data.users=await api('/access/users?q=');data.roles=await api('/access/roles');data.delreqs=await api('/access/deletion-requests');render(accessView());}
    else if(tab==='audit'){data.audit=await api('/audit?q='+encodeURIComponent(auditQ));render(auditView());}
    else if(tab==='settings'){data.settings=await api('/settings');render(settingsView());}
  }catch(e){flash(e.message);}
}

/* ---------- OVERVIEW ---------- */
function overviewView(){
  const o=data.orders||[];
  const repairs=o.filter(x=>x.type==='repair').length;
  const sells=o.filter(x=>x.type==='sell').length;
  const value=o.reduce((a,b)=>a+(b.amount||0),0);
  const pending=o.filter(x=>x.status==='placed');
  const leads=data.leads||[];const newLeads=leads.filter(l=>l.status==='new');
  const kpis=[['Total orders',o.length,'▤','green'],['Repairs',repairs,'✚','green'],['Resale pickups',sells,'↺','amber'],['Order value',INR(value),'₹','ink'],['Corporate leads',leads.length,'◍','amber']];
  return `<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">${kpis.map(k=>`<div class="kpi"><div class="kpi-ic ${k[3]}">${k[2]}</div><div class="kpi-n">${k[1]}</div><div class="kpi-l">${k[0]}</div></div>`).join('')}</div>
  <div class="ov-grid">
    <section class="card pad">
      <div class="card-h"><b>Recent orders</b><span class="link" onclick="setTab('orders')">View all →</span></div>
      ${o.length?o.slice(0,6).map(r=>`<div class="trow-mini"><span class="oref">${r.ref}</span><span class="badge ${r.type}">${r.type}</span><span class="odev">${esc(r.device_label)}</span><span class="oamt">${INR(r.amount)}</span>${statusBadge(r.type,r.status)}</div>`).join(''):`<div class="empty"><b>No orders yet</b><span>Place one from the storefront to see it here.</span></div>`}
    </section>
    <section class="card pad">
      <div class="card-h"><b>Catalog</b><span class="link" onclick="setTab('catalog')">Manage →</span></div>
      ${(data.catalog||[]).map(c=>`<div class="cat-line"><span>${catIco(c)} ${esc(c.name)}</span><b>${c.brands.reduce((s,b)=>s+b.models.length,0)} models</b></div>`).join('')}
      <div class="card-h" style="margin:20px 0 12px"><b>Needs attention</b></div>
      ${pending.length?`<div class="alert">⚠ ${pending.length} order${pending.length>1?'s':''} awaiting action<span class="link" onclick="setTab('orders')">Open →</span></div>`:''}
      ${newLeads.length?`<div class="alert" style="margin-top:8px">◍ ${newLeads.length} new corporate lead${newLeads.length>1?'s':''}<span class="link" onclick="setTab('corporate')">Open →</span></div>`:''}
      ${!pending.length&&!newLeads.length?`<div class="ok">✓ All caught up</div>`:''}
    </section>
  </div>`;
}

/* ---------- CATALOG ---------- */
function cityList(){const raw=(data.settings&&data.settings.cities)||'';const a=raw.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);return a.length?a:['Bengaluru','Mumbai','Delhi'];}
function findCatItem(level,id){for(const c of (data.catalog||[])){if(level==='category'&&c.id===id)return c;for(const b of c.brands){if(level==='brand'&&b.id===id)return b;for(const m of b.models){if(level==='model'&&m.id===id)return m;}}}return null;}
async function toggleItemCity(level,id,flow,city){const item=findCatItem(level,id);if(!item)return;
  let arr=((flow==='repair'?item.repair_cities:item.sell_cities)||[]).slice();
  const i=arr.indexOf(city); if(i>=0)arr.splice(i,1); else arr.push(city);
  try{await api('/item-cities',{method:'PUT',body:JSON.stringify({level,item_id:id,flow,cities:arr})});
    if(flow==='repair')item.repair_cities=arr; else item.sell_cities=arr; render(catalogView());}
  catch(e){flash(e.message);}}
function cityBlock(level,item){if(!showCities)return '';
  const row=(flow,lbl)=>`<div class="cityrow"><span class="citylbl">${lbl}</span>${cityList().map(c=>{const on=((flow==='repair'?item.repair_cities:item.sell_cities)||[]).includes(c);return `<button class="citychip ${on?'on':''}" onclick="toggleItemCity('${level}',${item.id},'${flow}','${c.replace(/'/g,"\\'")}')">${esc(c)}</button>`;}).join('')}</div>`;
  return `<div class="citywrap">${row('repair','Repair')}${row('sell','Resale')}</div>`;
}
function catalogView(){
  const c=data.catalog.find(x=>x.id===adminCat)||data.catalog[0];
  const cityOn=(data.settings&&data.settings.city_catalog)==='1';
  const prev=(c&&(c.emoji||'').startsWith('data:'))?`<img src="${c.emoji}" alt="" style="height:30px;width:auto">`:(c?(c.emoji||'📦'):'📦');
  return `<p class="lead">Add device types, brands, and models. Models carry a base resale value; repair pricing lives under <b>Repair pricing</b>.</p>
  <div class="card sec" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
    <div><b>City-wise catalogue</b><p class="hint">When ON, the storefront only shows an item in a city if it's ticked for that city (per Repair/Resale). When OFF, city is ignored. Configure cities below, then turn this on.</p></div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <label class="appchk"><input type="checkbox" ${showCities?'checked':''} onchange="showCities=this.checked;render(catalogView())"> Show city editors</label>
      <label class="swt"><input type="checkbox" ${cityOn?'checked':''} onchange="data.settings.city_catalog=this.checked?'1':'0';saveSetting('city_catalog',data.settings.city_catalog);render(catalogView())"><span>${cityOn?'On':'Off'}</span></label>
    </div>
  </div>
  <div class="catpick">${data.catalog.map(x=>`<div class="c ${x.id===adminCat?'on':''}" onclick="adminCat=${x.id};render(catalogView())">${catIco(x)} ${esc(x.name)}</div>`).join('')}</div>
  ${c?`<div class="card" style="padding:14px 16px;margin-bottom:14px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="width:46px;height:46px;border-radius:11px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:24px;overflow:hidden">${prev}</div>
    <div class="grow" style="min-width:150px"><div style="font-weight:600;font-size:13px">Category icon &amp; name</div><div style="font-size:12px;color:var(--ink-soft)">Shown across the storefront</div></div>
    <input value="${esc(c.name)}" style="max-width:190px" onchange="updCategory(${c.id},'name',this.value)">
    <input value="${(c.emoji||'').startsWith('data:')?'':esc(c.emoji)}" placeholder="emoji" style="max-width:74px;text-align:center" onchange="updCategory(${c.id},'emoji',this.value)">
    <button class="btn sm ghost" onclick="pickCatIcon(${c.id})">Upload icon</button>
    <button class="del" title="Delete category" onclick="delCategory(${c.id})">×</button>
  </div>
  <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)">
    <span style="font-size:12px;color:var(--ink-soft);font-weight:700">Available for</span>
    <label class="appchk"><input type="checkbox" ${c.for_repair?'checked':''} onchange="updCategory(${c.id},'for_repair',this.checked?1:0)"> Repair</label>
    <label class="appchk"><input type="checkbox" ${c.for_sell?'checked':''} onchange="updCategory(${c.id},'for_sell',this.checked?1:0)"> Resale</label>
  </div>${cityBlock('category',c)}</div>`:''}
  <div class="addbar card" style="border-radius:12px">
    <input id="nc_emoji" placeholder="📦" style="max-width:60px;flex:0 0 auto">
    <input id="nc_name" placeholder="New category name">
    <input id="nc_slug" placeholder="slug" style="max-width:120px;flex:0 0 auto">
    <button class="btn sm" onclick="addCategory()">＋ Category</button>
  </div>
  ${c?`<div class="eyebrow">${esc(c.name)} · brands & models</div>
  ${c.brands.map(b=>`<div class="card">
    <div class="brandhead">${esc(b.name)}
      <label class="appchk" style="margin-left:auto" title="Available for Repair"><input type="checkbox" ${b.for_repair?'checked':''} onchange="updBrand(${b.id},'for_repair',this.checked?1:0)"> Repair</label>
      <label class="appchk" title="Available for Resale"><input type="checkbox" ${b.for_sell?'checked':''} onchange="updBrand(${b.id},'for_sell',this.checked?1:0)"> Resale</label>
      <button class="del" style="margin-left:10px" onclick="delBrand(${b.id})">×</button></div>
    ${cityBlock('brand',b)}
    ${b.models.map(m=>`<div class="modrow">
      <input class="flat nm" value="${esc(m.name)}" onchange="updModel(${m.id},'name',this.value)">
      <span style="font-size:11px;color:var(--ink-soft)">base ₹</span>
      <input class="num" type="number" value="${m.base_value}" onchange="updModel(${m.id},'base_value',+this.value)">
      <label class="appchk" title="Available for Repair"><input type="checkbox" ${m.for_repair?'checked':''} onchange="updModel(${m.id},'for_repair',this.checked?1:0)"> R</label>
      <label class="appchk" title="Available for Resale"><input type="checkbox" ${m.for_sell?'checked':''} onchange="updModel(${m.id},'for_sell',this.checked?1:0)"> S</label>
      <button class="del" onclick="delModel(${m.id})">×</button></div>${cityBlock('model',m)}`).join('')}
    <div class="addbar"><input id="nm_name_${b.id}" placeholder="New model"><input id="nm_base_${b.id}" class="num" type="number" placeholder="base ₹"><button class="btn sm" onclick="addModel(${b.id})">＋ Model</button></div>
  </div>`).join('')}
  <div class="addbar card" style="border-radius:12px"><input id="nb_name" placeholder="New brand for ${esc(c.name)}"><button class="btn sm" onclick="addBrand(${c.id})">＋ Brand</button></div>`:''}`;
}
async function updCategory(id,f,v){await api('/categories/'+id,{method:'PUT',body:JSON.stringify({[f]:v})});flash('Saved');boot();}
async function delCategory(id){if(!confirm('Delete this category and all its brands & models?'))return;await api('/categories/'+id,{method:'DELETE'});adminCat=null;flash('Category deleted');boot();}
function pickCatIcon(id){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const url=await resizeToDataURL(f,96);if(url.length>300000){flash('Icon too large — try a smaller image');return;}await api('/categories/'+id,{method:'PUT',body:JSON.stringify({emoji:url})});flash('Icon updated');boot();}catch(e){flash('Could not read image');}};inp.click();}
async function addCategory(){const name=document.getElementById('nc_name').value.trim();let slug=document.getElementById('nc_slug').value.trim();if(!name)return flash('Enter a name');if(!slug)slug=name.toLowerCase().replace(/\s+/g,'-');try{const c=await api('/categories',{method:'POST',body:JSON.stringify({slug,name,emoji:document.getElementById('nc_emoji').value})});adminCat=c.id;flash('Category added');boot();}catch(e){flash(e.message);}}
async function addBrand(cid){const name=document.getElementById('nb_name').value.trim();if(!name)return flash('Enter a brand name');await api('/brands',{method:'POST',body:JSON.stringify({category_id:cid,name})});flash('Brand added');boot();}
async function updBrand(id,f,v){await api('/brands/'+id,{method:'PUT',body:JSON.stringify({[f]:v})});flash('Saved');}
async function delBrand(id){if(!confirm('Delete this brand and all its models?'))return;await api('/brands/'+id,{method:'DELETE'});flash('Brand deleted');boot();}
async function addModel(bid){const name=document.getElementById('nm_name_'+bid).value.trim();const base=+document.getElementById('nm_base_'+bid).value||0;if(!name)return flash('Enter a model name');await api('/models',{method:'POST',body:JSON.stringify({brand_id:bid,name,base_value:base})});flash('Model added');boot();}
async function updModel(id,f,v){await api('/models/'+id,{method:'PUT',body:JSON.stringify({[f]:v})});flash('Saved');}
async function delModel(id){await api('/models/'+id,{method:'DELETE'});flash('Model deleted');boot();}

/* ---------- REPAIR PRICING ---------- */
function repairView(){
  const c=data.catalog.find(x=>x.id===adminCat)||data.catalog[0];
  const models=c?c.brands.flatMap(b=>b.models.map(m=>({id:m.id,name:m.name,brand:b.name}))):[];
  return `<p class="lead">Set <b>default</b> prices per category, then pick a model to override where parts cost more or less.</p>
  <div class="catpick">${data.catalog.map(x=>`<div class="c ${x.id===adminCat?'on':''}" onclick="adminCat=${x.id};adminModel=null;boot()">${catIco(x)} ${esc(x.name)}</div>`).join('')}</div>
  <div class="eyebrow">Editing prices for</div>
  <div class="catpick">
    <div class="c ${!adminModel?'on':''}" onclick="adminModel=null;boot()">⭐ Default (all ${esc(c.name.toLowerCase())}s)</div>
    ${models.map(m=>`<div class="c ${adminModel===m.id?'on':''}" onclick="adminModel=${m.id};boot()">${esc(m.brand)} ${esc(m.name)}</div>`).join('')}
  </div>
  ${adminModel?modelPriceTable(models.find(m=>m.id===adminModel)):defaultPriceTable()}`;
}
function defaultPriceTable(){
  return `<div class="card"><div class="thead"><div style="flex:1">Issue</div><div style="width:96px">Default ₹</div><div style="width:74px">ETA</div><div style="width:64px">All models</div><div style="width:26px"></div></div>
    ${data.issues.map(it=>`<div class="crow">
      <input class="flat grow" value="${esc(it.name)}" onchange="updIssue(${it.id},'name',this.value)">
      <input class="num" type="number" value="${it.price}" onchange="updIssue(${it.id},'price',+this.value)">
      <input class="flat" style="width:74px" value="${esc(it.eta)}" onchange="updIssue(${it.id},'eta',this.value)">
      <label class="appchk" style="width:64px;justify-content:center" title="On = applies to every model in this category. Off = hidden by default; switch it on only for the models that have it (e.g. Touch Bar)."><input type="checkbox" ${it.default_on?'checked':''} onchange="updIssue(${it.id},'default_on',this.checked?1:0)"></label>
      <button class="del" onclick="delIssue(${it.id})">×</button></div>`).join('')}

/* DB-driven status helpers + colour badge (shared across views) */
function flowStatuses(flow){return (data.statuses||[]).filter(s=>s.flow===flow).slice().sort((a,b)=>a.sort-b.sort);}
function statusInfo(flow,key){return (data.statuses||[]).find(s=>s.flow===flow&&s.key===key)||{label:key,color:'orange'};}
function statusBadge(flow,key){const s=statusInfo(flow,key);return `<span class="badge2 ${s.color}">${esc(s.label||key)}</span>`;}
function ordersView(){
  if(!data.orders.length)return `<p class="lead">Repair bookings and resale pickups land here.</p><div class="card"><div class="empty"><b>No orders yet</b><span>Place one from the storefront to test the pipeline.</span></div></div>`;
  return `<p class="lead">${data.orders.length} order${data.orders.length>1?'s':''} <span class="pill">live</span> · update status to move an order through its pipeline. Customers see this on the tracking page.</p>
  <div class="card">${data.orders.map(o=>`<div class="ordrow">
    <div class="ordtop"><span class="ordref">${o.ref}</span><span class="badge ${o.type}">${o.type}</span><b>${esc(o.device_label||'')}</b><span class="amt">${INR(o.amount)}</span>${statusBadge(o.type,o.status)}</div>
    <div class="ordmeta">${esc(o.customer_name||'—')} · ${esc(o.customer_phone||'no phone')} · ${esc(o.slot||'')}</div>
    ${orderDetails(o)}
    <div class="rowline"><span class="lbl-mini">Status</span>
      <select onchange="setStatus('${o.ref}',this.value)">${flowStatuses(o.type).map(s=>`<option value="${s.key}" ${o.status===s.key?'selected':''}>${esc(s.label)}</option>`).join('')||`<option>${esc(o.status)}</option>`}</select>
      <button class="btn ghost" style="padding:7px 12px;font-size:13px;margin-left:auto" onclick="genInvoice('${o.ref}')">${o.type==='repair'?'Tax invoice':'Purchase voucher'}</button>${o.type==='sell'?`<button class="btn ghost" style="padding:7px 12px;font-size:13px" onclick="ownershipDoc('${o.ref}')">Purchase document</button>${o.has_kyc?(o.kyc_verified?`<span class="badge2 darkgreen">KYC verified</span><button class="del-btn" onclick="verifyKyc('${o.ref}',0)">Revoke</button>`:`<span class="badge2 orange">KYC pending</span><button class="btn ink" style="padding:7px 12px;font-size:13px" onclick="verifyKyc('${o.ref}',1)">Verify KYC</button>`):''}`:''}</div>
  </div>`).join('')}</div>`;
}
function orderDetails(o){
  let d=o.details; try{ if(typeof d==='string') d=JSON.parse(d); }catch(e){ d=null; }
  if(!d) return '';
  const box=inner=>inner?`<div style="margin-top:8px;font-size:12px;color:var(--ink-soft);line-height:1.65;background:rgba(14,23,38,.03);border-radius:10px;padding:9px 12px">${inner}</div>`:'';
  if(o.type==='sell'){
    const sum=Array.isArray(d.summary)?d.summary:[];
    const declared=sum.length?`<div><b style="color:var(--ink)">Condition declared:</b> ${sum.map(s=>esc(s.q)+' — <b>'+esc(s.a)+'</b>').join(' · ')}</div>`:'';
    let calc='';
    if(d.base_value!=null){
      const steps=sum.filter(s=>s.factor!=null).map(s=>`× ${s.factor}% <span style="opacity:.65">(${esc(s.a)})</span>`).join(' ');
      calc=`<div style="margin-top:3px"><b style="color:var(--ink)">Payout calc:</b> base ${INR(d.base_value)} ${steps} = <b style="color:var(--amber)">${INR(d.payout!=null?d.payout:o.amount)}</b></div>`;
    }
    return box(declared+calc);
  }
  if(o.type==='repair'){
    const items=Array.isArray(d.items)?d.items:[];
    let calc='';
    if(items.length){
      calc=`<div><b style="color:var(--ink)">Repair calc:</b> ${items.map(it=>esc(it.name)+' '+INR(it.price)).join(' + ')}${d.gst!=null?` + GST ${d.gst_percent}% (${INR(d.gst)})`:''} = <b style="color:var(--green)">${INR(d.total!=null?d.total:o.amount)}</b></div>`;
    }
    const svc=d.service_mode?`<div><b style="color:var(--ink)">Service:</b> ${esc(d.service_mode)}</div>`:'';
    return box(svc+calc);
  }
  return '';
}
async function setStatus(ref,status){await api('/orders/'+ref+'/status',{method:'PUT',body:JSON.stringify({status})});flash('Order '+ref+' → '+status);boot();}
function genInvoice(ref){
  const o=(data.orders||[]).find(x=>x.ref===ref);if(!o)return;
  const s=data.settings||{};const bn=s.brand_name||'ByteFix';
  let d={};try{d=JSON.parse(o.details||'{}');}catch(e){}
  const repair=o.type==='repair';
  const e=x=>String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const rows=repair&&Array.isArray(d.items)&&d.items.length
    ? d.items.map(it=>`<tr><td>${e(it.name)}</td><td style="text-align:right">${INR(it.price)}</td></tr>`).join('')
    : `<tr><td>${e(o.device_label||(repair?'Repair service':'Device purchase'))}</td><td style="text-align:right">${INR(repair?(d.total!=null?d.total:o.amount):o.amount)}</td></tr>`;
  const gst=repair?(d.gst!=null?d.gst:0):0;
  const gstp=d.gst_percent!=null?d.gst_percent:(s.gst_percent||18);
  const sub=repair?((Array.isArray(d.items)?d.items.reduce((a,b)=>a+(b.price||0),0):(o.amount-gst))):o.amount;
  const total=repair?(d.total!=null?d.total:o.amount):o.amount;
  const cgst=Math.round(gst/2),sgst=gst-cgst;
  const title=repair?'TAX INVOICE':'PURCHASE VOUCHER';
  const taxBlock=repair?`
    <tr><td style="text-align:right">Subtotal</td><td style="text-align:right">${INR(sub)}</td></tr>
    <tr><td style="text-align:right">CGST (${(gstp/2)}%)</td><td style="text-align:right">${INR(cgst)}</td></tr>
    <tr><td style="text-align:right">SGST (${(gstp/2)}%)</td><td style="text-align:right">${INR(sgst)}</td></tr>`:'';
  const note=repair?'Tax invoice for repair services rendered.':'Voucher for purchase of a used device from the individual named above (no GST — purchase from unregistered seller).';
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>${title} ${e(o.ref)}</title>
   <style>body{font-family:Arial,Helvetica,sans-serif;color:#111;max-width:720px;margin:24px auto;padding:0 22px}h1{font-size:18px;margin:0}.row{display:flex;justify-content:space-between;gap:20px;margin-top:14px}.box{font-size:13px;line-height:1.5}.muted{color:#666;font-size:12px}table{width:100%;border-collapse:collapse;margin:16px 0}td{border:1px solid #ccd;padding:8px 10px;font-size:14px}th{background:#f3f5f8;border:1px solid #ccd;padding:8px 10px;text-align:left;font-size:12px}.tot td{font-weight:bold;background:#f7f9fc}</style></head>
   <body>
   <div class="row"><div><h1>${e(bn)}</h1><div class="muted">${e(s.address||'')}<br>${e(s.phone||'')} ${e(s.email||'')}${s.gstin?('<br>GSTIN: '+e(s.gstin)):''}</div></div>
     <div style="text-align:right"><h1>${title}</h1><div class="muted">No: ${e(o.ref)}<br>${new Date(o.created_at||Date.now()).toLocaleString('en-IN')}</div></div></div>
   <div class="box" style="margin-top:14px"><b>${repair?'Bill to':'Seller'}:</b> ${e(o.customer_name||'')}<br>${e(o.customer_phone||'')} ${e(o.customer_email||'')}<br>${e(o.address||'')}</div>
   <table><thead><tr><th>Description</th><th style="text-align:right">Amount</th></tr></thead><tbody>
     ${rows}${taxBlock}
     <tr class="tot"><td style="text-align:right">${repair?'Total':'Amount paid to seller'}</td><td style="text-align:right">${INR(total)}</td></tr>
   </tbody></table>
   <p class="muted">${note}</p>
   <p class="muted">This is a computer-generated document.</p>
   <scr`+`ipt>window.onload=function(){setTimeout(function(){window.print();},350);}</scr`+`ipt>
   </body></html>`;
  const w=window.open('','_blank');if(!w){flash('Allow pop-ups to print');return;}w.document.write(html);w.document.close();
}
async function verifyKyc(ref,on){if(!on&&!confirm('Revoke verification for '+ref+'?'))return;try{await api('/service/orders/'+ref+'/kyc/verify',{method:'POST',body:JSON.stringify({verified:!!on})});data.orders=await api('/orders');flash(on?'KYC verified':'Verification revoked');render(ordersView());}catch(e){flash(e.message);}}
function maskId(type,num){num=String(num||'').trim();if(!num)return '—';if(/aadh/i.test(type||'')){const d=num.replace(/\D/g,'');return d.length>4?('XXXX XXXX '+d.slice(-4)):num;}return num;}

   <style>body{font-family:Arial,Helvetica,sans-serif;color:#111;max-width:720px;margin:24px auto;padding:0 22px;line-height:1.55}h1{font-size:20px;margin:0}table{width:100%;border-collapse:collapse;margin:16px 0}td{padding:8px 10px;border:1px solid #ccd;font-size:14px}.lbl{background:#f3f5f8;font-weight:bold;width:38%}.muted{color:#666;font-size:12px}.sig{margin-top:54px;display:flex;justify-content:space-between;gap:30px}.sig div{flex:1;border-top:1px solid #333;padding-top:6px;font-size:13px}.idwrap{position:relative;display:inline-block;margin-top:6px}.idimg{max-width:340px;border:1px solid #ccc;border-radius:8px;display:block}.idwm{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;transform:rotate(-24deg);pointer-events:none}.idwm span{color:rgba(192,57,43,.5);font-weight:800;font-size:13px;white-space:nowrap;letter-spacing:.04em}</style></head>
   <body>
   <h1>${e(bn)} &mdash; Device Sale &amp; Ownership Declaration</h1>
   <p class="muted">Reference: ${e(o.ref)} &nbsp;&middot;&nbsp; Generated: ${new Date().toLocaleString('en-IN')}</p>
   ${k.verified?`<div style="border:2px solid #2E7D32;background:#E7F4EA;color:#1b5e20;padding:10px 14px;border-radius:8px;font-weight:bold;margin:14px 0">&#10003; VERIFIED by ${e(bn)}${(k.verified_name||k.verified_username)?(' &middot; '+e(k.verified_name||k.verified_username)):''}${k.verified_at?(' &middot; '+new Date(k.verified_at).toLocaleString('en-IN')):''}</div>`:`<div style="border:2px solid #C0392B;background:#FCEBE9;color:#922;padding:10px 14px;border-radius:8px;font-weight:bold;margin:14px 0">NOT VERIFIED &mdash; this document is NOT valid until verified by ${e(bn)}.</div>`}
   <table>
     ${row('Seller name',k.consent_name||o.customer_name)}

     ${row('Processed by (operator)',k.operator_name||k.operator_username)}
   </table>
   <p><b>Declaration:</b> I, the seller named above, confirm that I am the rightful owner of the device described, that it is not lost, stolen, or under any legal encumbrance, and that I voluntarily sell it to ${e(bn)}. I consent to the collection of my identity document for KYC and record-keeping as required by applicable law.</p>
   <p class="muted">${signLine}</p>

    <div class="crow"><div class="grow"><div style="font-weight:600">Logo</div><div style="font-size:12px;color:var(--ink-soft)">Shown in the header & footer. PNG/SVG, auto-resized.</div></div>${logo}<button class="btn sm ghost" onclick="pickImage('logo')">Upload</button>${s.logo?`<button class="btn sm ghost" onclick="removeImage('logo')">Remove</button>`:''}</div>
    <div class="crow"><div class="grow"><div style="font-weight:600">Favicon</div><div style="font-size:12px;color:var(--ink-soft)">The little browser-tab icon.</div></div>${fav}<button class="btn sm ghost" onclick="pickImage('favicon')">Upload</button>${s.favicon?`<button class="btn sm ghost" onclick="removeImage('favicon')">Remove</button>`:''}</div>
    <div class="crow"><div class="grow" style="font-weight:600">Brand name</div><input class="w" style="max-width:260px" value="${esc(s.brand_name||'ReGear')}" onchange="saveSetting('brand_name',this.value)"></div>
    <div class="crow"><div class="grow" style="font-weight:600">Tagline</div><input class="w" style="max-width:320px" value="${esc(s.tagline||'')}" placeholder="Repair or sell your gadgets" onchange="saveSetting('tagline',this.value)"></div>
  </div>
  <div class="eyebrow">Contact &amp; location</div>
  <div class="card" style="padding:6px 0">
    <div class="crow"><div class="grow" style="font-weight:600">Phone</div><input class="w" style="max-width:260px" value="${esc(s.phone||'')}" placeholder="+91 …" onchange="saveSetting('phone',this.value)"></div>
    <div class="crow"><div class="grow" style="font-weight:600">Email</div><input class="w" style="max-width:260px" value="${esc(s.email||'')}" placeholder="hello@…" onchange="saveSetting('email',this.value)"></div>
    <div class="crow"><div class="grow" style="font-weight:600">Address</div><input class="w" style="max-width:340px" value="${esc(s.address||'')}" placeholder="Street, area" onchange="saveSetting('address',this.value)"></div>
    <div class="crow"><div class="grow" style="font-weight:600">City</div><input class="w" style="max-width:260px" value="${esc(s.city||'Bengaluru')}" onchange="saveSetting('city',this.value)"></div>
  </div>
  <div class="eyebrow">Service cities</div>
  <div class="card" style="padding:14px 16px">
    <div style="font-weight:600;font-size:13.5px;margin-bottom:7px">Cities in the customer location picker</div>
    <textarea class="w" rows="4" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-family:inherit;font-size:14px;resize:vertical" placeholder="Bengaluru, Mumbai, Delhi …" onchange="saveSetting('cities',this.value)">${esc(s.cities||DEFAULT_CITIES)}</textarea>
    <div style="font-size:12px;color:var(--ink-soft);margin-top:8px">Comma or new-line separated. This is the list customers pick from in the storefront's location modal.</div>
  </div>
  <div class="eyebrow">Sign-in</div>
  <div class="card" style="padding:14px 16px">
    <div style="font-weight:600;font-size:13.5px;margin-bottom:7px">Google Client ID</div>
    <input class="w" style="width:100%;font-family:'JetBrains Mono',monospace;font-size:13px" value="${esc(s.google_client_id||'')}" placeholder="xxxxxxxx.apps.googleusercontent.com" onchange="saveSetting('google_client_id',this.value.trim())">
    <div style="font-size:12px;color:var(--ink-soft);margin-top:8px">Paste your Google OAuth <b>Web</b> client ID to switch on “Continue with Google” for customers. In Google Cloud Console, add your site URL to the client's Authorized JavaScript origins. Leave blank to disable.</div>
  </div>
  <div class="card" style="padding:14px 16px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="font-weight:600;font-size:13.5px">Phone OTP via Firebase</div>
      <label class="swt"><input type="checkbox" ${s.otp_firebase==='1'?'checked':''} onchange="data.settings.otp_firebase=this.checked?'1':'0';saveSetting('otp_firebase',data.settings.otp_firebase)"><span>${s.otp_firebase==='1'?'On':'Off'}</span></label>
    </div>
    <div style="font-size:12px;color:var(--ink-soft);margin:6px 0 8px">When on, customer phone verification uses Firebase Phone Auth (real SMS). When off, the built-in OTP (demo code / MSG91) is used. Enable Phone provider in Firebase and add <code>${esc(s.brand_name||'your domain')}</code> to Authorized domains.</div>
    <div style="font-weight:600;font-size:12.5px;margin-bottom:5px">Firebase web config (JSON)</div>
    <textarea class="w" rows="6" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-family:'JetBrains Mono',monospace;font-size:12px;resize:vertical" placeholder='{ "apiKey": "...", "authDomain": "...", "projectId": "...", "appId": "..." }' onchange="saveSetting('firebase_config',this.value.trim())">${esc(s.firebase_config||'')}</textarea>
    <div style="font-size:12px;color:var(--ink-soft);margin-top:8px">Paste the <b>Firebase config object</b> from Firebase Console → Project settings → Your web app. Requires the Blaze plan for production SMS.</div>
  </div>
  <div class="card" style="padding:14px 16px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="font-weight:600;font-size:13.5px">Phone OTP via 2Factor.in${s.twofactor_api_key_set?' <span style="color:var(--green);font-size:11px">· key saved</span>':''}</div>
      <label class="swt"><input type="checkbox" ${s.otp_2factor==='1'?'checked':''} onchange="data.settings.otp_2factor=this.checked?'1':'0';saveSetting('otp_2factor',data.settings.otp_2factor)"><span>${s.otp_2factor==='1'?'On':'Off'}</span></label>
    </div>
    <div style="font-size:12px;color:var(--ink-soft);margin:6px 0 8px">When on, OTP SMS is sent &amp; verified by 2Factor (real SMS, no DLT needed to start). Get a free API key at 2factor.in. Leave Firebase off if you use this.</div>
    <div style="font-weight:600;font-size:12.5px;margin-bottom:5px">2Factor API key ${s.twofactor_api_key_set?'(saved — paste again to change)':'(not set)'}</div>
    <input class="w" style="width:100%;font-family:'JetBrains Mono',monospace;font-size:13px" placeholder="paste your 2Factor API key" onchange="if(this.value.trim()){saveSetting('twofactor_api_key',this.value.trim());this.value='';flash('Key saved')}">
    <div style="font-size:12px;color:var(--ink-soft);margin:8px 0 5px">The key is stored securely on the server and never shown again.</div>
    <div style="font-weight:600;font-size:12.5px;margin:6px 0 5px">SMS template name (recommended)</div>
    <input class="w" style="width:100%;font-size:13px" value="${esc(s.twofactor_template||'')}" placeholder="exact template name from 2Factor (forces SMS, avoids voice call)" onchange="saveSetting('twofactor_template',this.value.trim())">
    <div style="font-size:12px;color:var(--ink-soft);margin-top:8px">Create an <b>SMS OTP template</b> in the 2Factor dashboard and put its exact name here. Without it, 2Factor may deliver the code as a <b>voice call</b>.</div>
  </div>
  <div class="eyebrow">SEO</div>
  <div class="card" style="padding:14px 16px">
    <div style="font-weight:600;font-size:13.5px;margin-bottom:7px">Meta description</div>
    <textarea class="w" rows="3" style="border:1px solid var(--line);border-radius:10px;padding:11px;font-family:inherit;font-size:14px;resize:vertical" placeholder="One or two sentences describing your store for Google & social shares." onchange="saveSetting('meta_description',this.value)">${esc(s.meta_description||'')}</textarea>
    <div style="font-size:12px;color:var(--ink-soft);margin-top:8px">Used in the page title tag area, Open Graph share cards, and structured data.</div>
  </div>
  <div class="eyebrow">Legal &amp; policies</div>
  <div class="card" style="padding:14px 16px">
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px">These appear as pages linked in the storefront footer. Have a legal advisor review the final wording. Plain text; blank lines start new paragraphs.</div>
    ${[['policy_privacy','Privacy Policy'],['policy_terms','Terms of Service'],['policy_refund','Refund &amp; Cancellation'],['policy_shipping','Shipping &amp; Pickup']].map(([k,lbl])=>`
      <div style="font-weight:600;font-size:12.5px;margin:10px 0 5px">${lbl}</div>
      <textarea class="w" rows="5" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-family:inherit;font-size:13.5px;resize:vertical" onchange="saveSetting('${k}',this.value)">${esc(s[k]||'')}</textarea>`).join('')}
  </div>
  <div class="eyebrow">Pricing &amp; tax</div>
  <div class="crow card" style="border-radius:12px"><div class="grow" style="font-weight:600">GST applied to repair total</div><input class="num" type="number" value="${s.gst_percent||18}" onchange="saveSetting('gst_percent',+this.value)"> %</div>
  <div class="crow card" style="border-radius:12px"><div class="grow" style="font-weight:600">GSTIN (printed on tax invoices)</div><input style="max-width:220px;font-family:'JetBrains Mono',monospace;font-size:13px" value="${esc(s.gstin||'')}" placeholder="22AAAAA0000A1Z5" onchange="saveSetting('gstin',this.value.trim().toUpperCase())"></div>
  <p class="lead" style="margin-top:18px">In production this screen also manages users, roles, and an audit log of changes. For real SEO, the storefront should be server-rendered (e.g. Next.js) with per-locality pages.</p>`;
}
async function saveSetting(k,v){await api('/settings',{method:'PUT',body:JSON.stringify({[k]:v})});data.settings[k]=v;flash('Saved');}
function pickImage(kind){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const url=await resizeToDataURL(f,kind==='favicon'?64:360);if(url.length>700000){flash('Image too large — try a smaller one');return;}await api('/settings',{method:'PUT',body:JSON.stringify({[kind]:url})});data.settings[kind]=url;flash(kind+' updated');boot();}catch(e){flash('Could not read image');}};inp.click();}
function resizeToDataURL(file,maxW){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,maxW/img.width);const w=Math.round(img.width*sc),h=Math.round(img.height*sc);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);res(cv.toDataURL('image/png'));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
async function removeImage(kind){await api('/settings',{method:'PUT',body:JSON.stringify({[kind]:''})});data.settings[kind]='';flash('Removed');boot();}

/* ---------- COMMUNICATIONS (journey tabs + per-step editor) ---------- */
const COLOR_OPTS=[['red','Red'],['orange','Orange'],['yellow','Yellow'],['lightgreen','Light green'],['darkgreen','Dark green']];
function escA(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function commsView(){
  const s=data.settings||{};
  const on=s.email_notifications!=='0';
  if(commsTab!=='repair'&&commsTab!=='sell')commsTab='repair';
  const journeys=[['repair','Repair journey'],['sell','Resale journey']];
  const tabs=journeys.map(([k,l])=>`<div class="comtab ${k===commsTab?'on':''}" onclick="setCommsTab('${k}')">${l}</div>`).join('');
  const steps=flowStatuses(commsTab);
  if(!steps.find(x=>x.key===commsStatus))commsStatus=(steps[0]||{}).key||null;
  const cur=steps.find(x=>x.key===commsStatus);
  const tpl=(data.templates||[]).find(t=>t.key===commsTab+':'+commsStatus)||{subject:'',body:''};
  const editor=cur?`
    <div class="card sec">
      <div class="formrow">
        <div class="f"><label>Status step</label>
          <select onchange="commsStatus=this.value;render(commsView())">${steps.map(x=>`<option value="${x.key}" ${x.key===commsStatus?'selected':''}>${escA(x.label)}</option>`).join('')}</select></div>
        <div class="f"><label>Colour badge</label>
          <select id="c_color">${COLOR_OPTS.map(c=>`<option value="${c[0]}" ${cur.color===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div>
        <div class="f"><label>Preview</label><div class="previewcell">${statusBadge(commsTab,commsStatus)}</div></div>
      </div>
      <label class="fl">Step label (tracker &amp; badge)</label>
      <input class="fw" id="c_label" value="${escA(cur.label)}">
      <label class="fl">Email subject</label>
      <input class="fw" id="c_subject" value="${escA(tpl.subject)}">
      <label class="fl">Email message</label>
      <textarea class="fw" rows="3" id="c_body">${escA(tpl.body)}</textarea>
      <p class="hint">Placeholders: <code>{name}</code> <code>{ref}</code> <code>{device}</code> <code>{amount}</code>.</p>
      <div class="actions"><button class="btn ink" onclick="saveCommsStep()">Save step</button>
        <button class="del-btn" onclick="deleteStatus(${cur.id})">Delete step</button></div>
    </div>
    <div class="card sec">
      <b>Add a step to the ${commsTab==='repair'?'repair':'resale'} journey</b>
      <div class="formrow" style="margin-top:var(--s3)">
        <div class="f"><label>Key (letters/numbers)</label><input id="ns_key" placeholder="e.g. shipped"></div>
        <div class="f"><label>Label</label><input id="ns_label" placeholder="e.g. Shipped"></div>
        <div class="f"><label>Colour</label><select id="ns_color">${COLOR_OPTS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div>
      </div>
      <div class="actions"><button class="btn" onclick="addStatus()">Add step</button></div>
    </div>`:`<div class="card sec"><div class="empty"><b>No steps yet</b><span>Add the first step for this journey.</span></div></div>`;
  return `
    <div class="card sec">
      <div class="switchrow">
        <div><b>Email the customer on every order update</b><p class="hint">When on, the customer is emailed at booking and at every status change, using these templates. Delivery is live when <code>RESEND_API_KEY</code>/<code>MAIL_FROM</code> are set, otherwise logged (demo).</p></div>
        <label class="swt"><input type="checkbox" ${on?'checked':''} onchange="data.settings.email_notifications=this.checked?'1':'0';saveSetting('email_notifications',data.settings.email_notifications);render(commsView())"><span>${on?'On':'Off'}</span></label>
      </div>
    </div>
    <div class="comtabs">${tabs}</div>
    ${editor}`;
}
function setCommsTab(k){commsTab=k;commsStatus=null;render(commsView());}
async function saveCommsStep(){
  const cur=flowStatuses(commsTab).find(x=>x.key===commsStatus); if(!cur)return;
  const color=document.getElementById('c_color').value;
  const label=document.getElementById('c_label').value.trim();
  const subject=document.getElementById('c_subject').value;
  const body=document.getElementById('c_body').value;
  if(!label){flash('Step label is required');return;}
  try{
    await api('/service/order-statuses/'+cur.id,{method:'PUT',body:JSON.stringify({label,color})});
    await api('/order-templates/'+encodeURIComponent(commsTab+':'+commsStatus),{method:'PUT',body:JSON.stringify({label,subject,body})});
    data.statuses=await api('/service/order-statuses');data.templates=await api('/order-templates');
    flash('Saved');render(commsView());
  }catch(e){flash(e.message);}
}
async function addStatus(){
  const key=document.getElementById('ns_key').value.trim();
  const label=document.getElementById('ns_label').value.trim();
  const color=document.getElementById('ns_color').value;
  if(!/^[a-z0-9_]+$/i.test(key)){flash('Key must be letters/numbers only');return;}
  if(!label){flash('Label is required');return;}
  try{
    const st=await api('/service/order-statuses',{method:'POST',body:JSON.stringify({flow:commsTab,key,label,color})});
    data.statuses=await api('/service/order-statuses');data.templates=await api('/order-templates');
    commsStatus=st.key;flash('Step added');render(commsView());
  }catch(e){flash(e.message);}
}
async function deleteStatus(id){
  if(!confirm('Delete this step? Any orders using it must be reassigned first.'))return;
  try{await api('/service/order-statuses/'+id,{method:'DELETE'});data.statuses=await api('/service/order-statuses');commsStatus=null;flash('Deleted');render(commsView());}
  catch(e){flash(e.message);}
}

/* ---------- ACCESS (users, roles, permissions) ---------- */
const ROLE_COLOR={superadmin:'darkgreen',operator:'orange',repair_operator:'lightgreen',sell_operator:'yellow',customer:'yellow'};
function roleBadge(rk){return `<span class="badge2 ${ROLE_COLOR[rk]||'yellow'}">${esc(rk)}</span>`;}
function accessView(){
  const users=data.users||[],roles=data.roles||[];
  const rows=users.map(u=>{
    const title=esc(u.name||u.username||u.phone||('User #'+u.id));
    const sub=[u.username&&('@'+u.username),u.email,u.phone].filter(Boolean).map(esc).join(' · ');
    const chips=roles.map(r=>`<label class="rolechk"><input type="checkbox" data-uid="${u.id}" value="${r.key}" ${(u.roles||[]).includes(r.key)?'checked':''}> ${esc(r.name)}</label>`).join('');
    return `<div class="card sec">
      <div class="acchead"><div><b>${title}</b><div class="hint">${sub||'—'}</div></div>
        <div class="accbadges">${(u.roles||[]).map(roleBadge).join(' ')}</div></div>
      <div class="roleopts">${chips}</div>
      <div class="actions"><button class="btn ink" onclick="saveRoles(${u.id})">Save roles</button></div>
      ${(u.perms||[]).includes('service_requests')&&!(u.perms||[]).includes('admin_panel')?`
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)">
          <div class="hint" style="margin-bottom:6px">Cities this operator covers — leave all unticked for <b>all cities</b>.</div>
          <div class="roleopts">${cityList().map(c=>`<label class="rolechk"><input type="checkbox" data-city-uid="${u.id}" value="${esc(c)}" ${(u.cities||[]).includes(c)?'checked':''}> ${esc(c)}</label>`).join('')}</div>
          <div class="actions"><button class="btn" onclick="saveCities(${u.id})">Save cities</button></div>
        </div>`:''}
    </div>`;
  }).join('');
  const dr=data.delreqs||[];
  const drCard=dr.length?`<div class="card sec"><b>Data deletion requests (DPDP)</b>
      <p class="hint">Process each per your retention policy, then mark it done.</p>
      ${dr.map(d=>`<div class="acchead" style="border-top:1px solid var(--line-2);padding-top:10px;margin-top:10px">
        <div><b>${esc(d.name||'—')}</b><div class="hint">${esc(d.phone||'')} ${esc(d.email||'')} · ${esc(d.ts)}${d.reason?(' · '+esc(d.reason)):''}</div></div>
        <div>${d.status==='done'?'<span class="badge2 darkgreen">done</span>':`<button class="btn ink" onclick="markDelReq(${d.id})">Mark done</button>`}</div></div>`).join('')}
    </div>`:'';
  return `
    ${drCard}
    <div class="card sec"><b>Manage who can do what</b>
      <p class="hint">Search any account in the database and assign roles. <b>Super Admin</b> = full admin panel + main app. <b>Operator</b> = Service Requests in the main app. <b>Customer</b> = booking only.</p>
      <div class="searchbar"><input id="userq" placeholder="Search by name, email, phone or username…" value="${esc(accessQ)}" oninput="accessSearch(this.value)"></div>
    </div>
    ${users.length?rows:`<div class="card sec"><div class="empty"><b>No users found</b><span>Try a different search term.</span></div></div>`}`;
}
function accessSearch(q){accessQ=q;clearTimeout(accessTimer);accessTimer=setTimeout(async()=>{data.users=await api('/access/users?q='+encodeURIComponent(q));render(accessView());const el=document.getElementById('userq');if(el){el.focus();const v=el.value;el.value='';el.value=v;}},250);}
async function saveCities(uid){const cities=[...document.querySelectorAll('input[data-city-uid="'+uid+'"]:checked')].map(x=>x.value);try{await api('/access/users/'+uid+'/cities',{method:'PUT',body:JSON.stringify({cities})});data.users=await api('/access/users?q='+encodeURIComponent(accessQ));flash('Cities updated');render(accessView());}catch(e){flash(e.message);}}
async function markDelReq(id){try{await api('/access/deletion-requests/'+id,{method:'PUT',body:JSON.stringify({status:'done'})});data.delreqs=await api('/access/deletion-requests');flash('Marked done');render(accessView());}catch(e){flash(e.message);}}
async function saveRoles(uid){
  const checked=[...document.querySelectorAll('input[data-uid="'+uid+'"]:checked')].map(x=>x.value);
  try{await api('/access/users/'+uid+'/roles',{method:'PUT',body:JSON.stringify({roles:checked})});data.users=await api('/access/users?q='+encodeURIComponent(accessQ));flash('Roles updated');render(accessView());}
  catch(e){flash(e.message);}
}

/* ---------- AUDIT LOG ---------- */
function auditView(){
  const rows=data.audit||[];
  return `<div class="card sec">
      <div class="switchrow"><div><b>Audit log</b><p class="hint">Every admin/operator change is recorded automatically — logins, status changes, catalog/pricing edits, role &amp; settings changes. ${rows.length} most recent shown.</p></div>
        <button class="btn" onclick="downloadAudit()">Export CSV</button></div>
      <div class="searchbar"><input id="auditq" placeholder="Search actor, action or detail…" value="${esc(auditQ)}" oninput="auditSearch(this.value)"></div>
    </div>
    <div class="card sec" style="overflow-x:auto;padding:0">
      <table class="audit-tbl"><thead><tr><th>Time (UTC)</th><th>Actor</th><th>Role</th><th>Action</th><th>Detail</th><th>IP</th></tr></thead>
      <tbody>${rows.length?rows.map(r=>`<tr><td class="mono">${esc(r.ts)}</td><td>${esc(r.actor_name||'—')}</td><td>${esc(r.actor_role||'')}</td><td><b>${esc(r.action||'')}</b></td><td class="adet">${esc(r.detail||'')}</td><td class="mono">${esc(r.ip||'')}</td></tr>`).join(''):`<tr><td colspan="6" style="padding:18px;color:var(--ink-soft)">No entries yet.</td></tr>`}</tbody></table>
    </div>`;
}
function auditSearch(q){auditQ=q;clearTimeout(auditTimer);auditTimer=setTimeout(async()=>{data.audit=await api('/audit?q='+encodeURIComponent(q));render(auditView());const el=document.getElementById('auditq');if(el){el.focus();const v=el.value;el.value='';el.value=v;}},250);}
async function downloadAudit(){
  try{const r=await fetch(API+'/audit.csv?q='+encodeURIComponent(auditQ),{headers:{'Authorization':'Bearer '+TOKEN}});const blob=await r.blob();
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='audit-log.csv';a.click();URL.revokeObjectURL(a.href);}
  catch(e){flash('Could not export');}
}

boot();
</script>
</body>
</html>
