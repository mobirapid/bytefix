    <div class="modal-head"><span>Choose your city</span><span class="modal-x" onclick="closeCityModal()">✕</span></div>
    <input id="cmSearch" class="cm-search" placeholder="Search a city across India…" oninput="filterCity(this.value)">
    <div class="cm-list"></div>
  </div>
</div>

<script>
const API='/api';
const INR=n=>'₹'+Number(Math.round(n||0)).toLocaleString('en-IN');
const SLOTS=['Today, 4–6 PM','Tomorrow, 10–12','Tomorrow, 2–4 PM','Sat, 11–1 PM','Sat, 5–7 PM','Sun, 12–2 PM'];
const MODES=[['pickup','🚚','Pickup & drop','We collect, repair, return','Free'],['walkin','🏪','Store walk-in','Fastest turnaround','Free']];
let CATALOG=[],CONDITIONS=[],SET={},S={},stack=[],mode='home',corpIntent='sell',STAT=[];
/* DB-driven status helpers + colour badge (shared look with admin) */
function flowSteps(flow){return STAT.filter(s=>s.flow===flow).slice().sort((a,b)=>a.sort-b.sort);}
function statInfo(flow,key){return STAT.find(s=>s.flow===flow&&s.key===key)||{label:key,color:'orange'};}
function badge(flow,key){const s=statInfo(flow,key);return `<span class="badge2 ${s.color}">${esc(s.label||key)}</span>`;}
function hasPerm(p){return !!(ME&&ME.perms&&ME.perms.includes(p));}

/* ---- Phase 1 helpers: countries, validation, location, city ---- */
const val=id=>((document.getElementById(id)||{}).value||'').trim();
const COUNTRIES=[['🇮🇳','+91'],['🇺🇸','+1'],['🇬🇧','+44'],['🇦🇪','+971'],['🇸🇬','+65'],['🇦🇺','+61'],['🇨🇦','+1'],['🇩🇪','+49'],['🇫🇷','+33'],['🇸🇦','+966']];
function ccOptions(sel){sel=sel||'+91';return COUNTRIES.map(c=>`<option value="${c[1]}" ${c[1]===sel?'selected':''}>${c[0]} ${c[1]}</option>`).join('');}
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function fieldErr(el,msg){if(!el)return;el.classList.toggle('bad',!!msg);let e=el.querySelector('.err');if(msg){if(!e){e=document.createElement('div');e.className='err';el.appendChild(e);}e.textContent=msg;}else if(e)e.remove();}
function setErr(id,msg){const f=document.getElementById(id);fieldErr(f&&f.closest('.field'),msg);}
function clearErrs(){document.querySelectorAll('.field.bad').forEach(el=>fieldErr(el,''));}
function useLocation(btnId,addrId){const btn=document.getElementById(btnId);if(!navigator.geolocation){alert('Location is not supported on this device.');return;}const orig=btn.innerHTML;btn.textContent='Locating…';btn.disabled=true;
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{const la=pos.coords.latitude,lo=pos.coords.longitude;
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${la}&lon=${lo}`,{headers:{'Accept':'application/json'}});
      const d=await r.json();const a=document.getElementById(addrId);
      if(d&&d.display_name&&a){a.value=d.display_name;setErr(addrId,'');}
      const ad=d&&d.address;const found=ad&&(ad.city||ad.town||ad.village||ad.state_district||ad.county);
      if(found)setCity(found);
    }catch(e){alert('Could not fetch your address automatically — please type it in.');}
    finally{btn.innerHTML=orig;btn.disabled=false;}
  },()=>{btn.innerHTML=orig;btn.disabled=false;alert('Location permission denied — please type your address.');},{enableHighAccuracy:true,timeout:10000});
}
let CITIES=['Bengaluru','Mumbai','Delhi','Hyderabad','Chennai','Pune','Kolkata','Ahmedabad','Jaipur','Surat','Lucknow','Chandigarh','Kochi','Indore','Nagpur','Coimbatore','Visakhapatnam','Bhopal','Patna','Gurugram','Noida','Mysuru','Vadodara','Thiruvananthapuram'];
let CITY=''; try{CITY=localStorage.getItem('regear_city')||'';}catch(e){}
function openCityModal(){const m=document.getElementById('cityModal');m.querySelector('.cm-list').innerHTML=CITIES.map(c=>`<div class="cm-item ${c===CITY?'on':''}" onclick="setCity('${c}')">${c}</div>`).join('');m.style.display='flex';const s=document.getElementById('cmSearch');s.value='';s.focus();}
function closeCityModal(){document.getElementById('cityModal').style.display='none';}
function filterCity(q){q=(q||'').toLowerCase();document.querySelectorAll('#cityModal .cm-item').forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(q)?'':'none';});}
function setCity(c){CITY=c;try{localStorage.setItem('regear_city',c);}catch(e){}const el=document.getElementById('city');if(el)el.textContent=c;closeCityModal();}

/* ---- accounts (passwordless phone-OTP, Cashify-style) ---- */
let SESSION='';try{SESSION=localStorage.getItem('regear_session')||'';}catch(e){}
let ME=null;
async function aapi(p,o={}){const r=await fetch(API+p,{headers:{'Content-Type':'application/json','Authorization':'Bearer '+SESSION},...o});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Error');return r.json();}
function setSession(tok,user){SESSION=tok;ME=user;try{localStorage.setItem('regear_session',tok);}catch(e){}syncAuth();if(mode==='home')renderMyOrders();}
function clearSession(){SESSION='';ME=null;try{localStorage.removeItem('regear_session');}catch(e){}syncAuth();if(mode==='home')renderMyOrders();}
function first(n){return String(n||'you').trim().split(' ')[0]||'you';}
function syncAuth(){const b=document.getElementById('authBtn'),su=document.getElementById('signupBtn');if(b)b.textContent=ME?('Hi, '+first(ME.name)):'Log in';if(su)su.style.display=ME?'none':'';
  const sv=document.getElementById('svcLink');if(sv)sv.style.display=hasPerm('service_requests')?'':'none';
  const st=document.getElementById('staffLink');if(st)st.style.display=ME?'none':'';
  // mobile menu mirror
  const bm=document.getElementById('authBtnM');if(bm)bm.textContent=ME?('Hi, '+first(ME.name)):'Log in';
  const sm=document.getElementById('signupBtnM');if(sm)sm.style.display=ME?'none':'';
  const svm=document.getElementById('mSvc');if(svm)svm.style.display=hasPerm('service_requests')?'':'none';
  const stm=document.getElementById('mStaff');if(stm)stm.style.display=ME?'none':'';}
function toggleMenu(){const m=document.getElementById('mnav');if(m)m.classList.toggle('open');}
function closeMenu(){const m=document.getElementById('mnav');if(m)m.classList.remove('open');}
function authClick(){if(ME){showProfile();return;}S.authMode='login';S.fromBooking=false;enterFlow(loginPhone);}
function signupClick(){S.authMode='signup';S.fromBooking=false;enterFlow(loginPhone);}
/* ---- Phone OTP layer: Firebase when enabled in admin, else server OTP ---- */
function fbConfig(){try{return JSON.parse(SET.firebase_config||'{}');}catch(e){return {};}}
function fbEnabled(){const c=fbConfig();return SET.otp_firebase==='1'&&c&&c.apiKey&&c.projectId;}
function fbEmailEnabled(){const c=fbConfig();return SET.otp_email_firebase==='1'&&c&&c.apiKey&&c.projectId;}
let _fbReady=null,_fbAuth=null;
function loadFirebase(){if(_fbReady)return _fbReady;_fbReady=new Promise((res,rej)=>{
  const add=(src,cb)=>{const s=document.createElement('script');s.src=src;s.onload=cb;s.onerror=()=>rej(new Error('Firebase failed to load'));document.head.appendChild(s);};
  add('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',()=>add('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js',()=>{
    try{if(!firebase.apps.length)firebase.initializeApp(fbConfig());_fbAuth=firebase.auth();res();}catch(e){rej(e);}}));
});return _fbReady;}
function e164(){return (S.dial||'+91')+String(S.phone||'').replace(/\D/g,'');}
// Firebase passwordless email link: send a sign-in link the user clicks to verify.
async function sendEmailLink(email,kind){
  await loadFirebase();
  localStorage.setItem('regear_emaillink',kind);
  localStorage.setItem('regear_emaillink_email',email);
  const acs={url:location.origin+location.pathname+'?emaillink='+encodeURIComponent(kind),handleCodeInApp:true};
  await _fbAuth.sendSignInLinkToEmail(email,acs);
}
// On load: if we returned from an email link, complete sign-in and restore state.
async function handleEmailLinkReturn(){
  if(!fbEmailEnabled())return false;
  let auth;try{await loadFirebase();auth=_fbAuth;}catch(e){return false;}
  if(!auth.isSignInWithEmailLink(location.href))return false;
  const kind=localStorage.getItem('regear_emaillink')||'';
  let email=localStorage.getItem('regear_emaillink_email')||'';
  if(!email){email=window.prompt('Confirm the email you used to verify')||'';}
  try{
    const cred=await auth.signInWithEmailLink(email,location.href);
    const idToken=await cred.user.getIdToken();
    history.replaceState({},'',location.pathname);
    const r=await api('/otp/email/firebase',{method:'POST',body:JSON.stringify({idToken})});
    if(kind==='corp'){
      try{S.corp=JSON.parse(localStorage.getItem('regear_corp')||'{}');}catch(e){S.corp=S.corp||{};}
      S.corp.email=r.email||email;S.corp.emailToken=r.token;S.corp.emailV=true;S.corp.emailOtp=false;S.corp.emailLinkSent=false;S.corp.emailMsg='';
    }
  }catch(e){console.error('[emaillink]',e.message);}
  localStorage.removeItem('regear_emaillink');localStorage.removeItem('regear_emaillink_email');localStorage.removeItem('regear_corp');
  if(kind==='corp'){showCorporate();return true;}
  return false;
}
async function otpSend(){
  if(fbEnabled()){
    await loadFirebase();
    if(!document.getElementById('fb-recaptcha')){const d=document.createElement('div');d.id='fb-recaptcha';document.body.appendChild(d);}
    if(!window._fbVerifier)window._fbVerifier=new firebase.auth.RecaptchaVerifier('fb-recaptcha',{size:'invisible'});
    S._fbConfirm=await _fbAuth.signInWithPhoneNumber(e164(),window._fbVerifier);
    return {dev_code:''};
  }
  return await api('/otp/send',{method:'POST',body:JSON.stringify({phone:S.phone})});
}
async function otpVerify(code){
  if(fbEnabled()){
    if(!S._fbConfirm)throw new Error('Please request a code first');
    const cred=await S._fbConfirm.confirm(code);
    const idToken=await cred.user.getIdToken();
    return await api('/otp/firebase',{method:'POST',body:JSON.stringify({idToken})});
  }
  return await api('/otp/verify',{method:'POST',body:JSON.stringify({phone:S.phone,code})});
}
function loginPhone(){const su=S.authMode==='signup';return `<div class="step-h">${su?'Create your account':'Log in or sign up'}</div><p class="fsub">${su?'Sign up with Google, or use your phone number.':'Continue with Google, or get a one-time code on your phone.'}</p>
  <div id="gsection"><div class="gwrap"><div id="gbtn"></div></div><div class="ordiv"><span>or use your phone</span></div></div>
  <div class="field"><label>Mobile number</label><div class="ccrow"><select id="lg_cc" class="cc">${ccOptions(S.dial)}</select><input id="lg_phone" placeholder="10-digit mobile" inputmode="tel" value="${esc(S.phone||'')}"></div></div>
  <div class="dock"><button class="btn green" id="lgbtn" onclick="loginSendOtp()">Send code →</button></div>`;}
async function loginSendOtp(){clearErrs();S.dial=val('lg_cc')||'+91';S.phone=val('lg_phone');const d=S.phone.replace(/\D/g,'');if(d.length<(S.dial==='+91'?10:7)){setErr('lg_phone','Enter a valid mobile number');return;}
  try{const r=await otpSend();S.devCode=r.dev_code||'';S.fromBooking=false;nav(loginOtp);}catch(e){alert(e.message);}}
function loginOtp(){return `<div class="step-h">Enter your code</div><p class="fsub">Sent to <b>${esc(S.phone)}</b>.</p>
  ${S.devCode?`<div class="muted-card" style="color:var(--green)">Demo code: <b style="font-family:'JetBrains Mono'">${S.devCode}</b></div>`:''}
  <div class="field"><label>One-time code</label><input id="lg_code" inputmode="numeric" maxlength="6" placeholder="––––––" style="letter-spacing:8px;text-align:center;font-family:'JetBrains Mono';font-size:22px"></div>
  <div class="dock"><button class="btn green" id="lgvbtn" onclick="loginVerify()">Verify →</button><button class="btn btn-ghost" onclick="loginSendOtp()">Resend code</button></div>`;}
async function loginVerify(){const code=val('lg_code');if(code.length<4)return alert('Enter the code');const btn=document.getElementById('lgvbtn');btn.textContent='Verifying…';btn.disabled=true;
  try{const r=await otpVerify(code);S.booking_token=r.token;
    const a=await api('/account/resolve',{method:'POST',body:JSON.stringify({booking_token:S.booking_token})});
    if(a.exists){const s=await api('/account/save',{method:'POST',body:JSON.stringify({booking_token:S.booking_token})});setSession(s.session,s.user);showProfile();}
    else{nav(loginSignup);}
  }catch(e){btn.disabled=false;btn.textContent='Verify →';alert(e.message);}}
function loginSignup(){return `<div class="step-h">Create your account</div><p class="fsub">Just a couple of details to finish ${S.fromBooking?'your order':'signing up'}.</p>
  <div class="field"><label>Full name</label><input id="su_name" placeholder="Your name" value="${esc(S.name||'')}"></div>
  <div class="field"><label>Email</label><input id="su_email" type="email" placeholder="you@email.com" value="${esc(S.email||'')}"></div>
  <label class="prefrow"><input type="checkbox" id="su_eu" checked> Email me updates about my orders</label>
  <label class="prefrow"><input type="checkbox" id="su_consent"> I agree to the <a onclick="showPolicy('terms');return false" href="#">Terms</a> &amp; <a onclick="showPolicy('privacy');return false" href="#">Privacy Policy</a></label>
  <div class="dock"><button class="btn green" id="subtn" onclick="finishSignup()">${S.fromBooking?'Create account & continue →':'Create account →'}</button></div>`;}
async function finishSignup(){clearErrs();const name=val('su_name'),email=val('su_email');let ok=true;if(name.length<2){setErr('su_name','Please enter your name');ok=false;}if(!EMAIL_RE.test(email)){setErr('su_email','Enter a valid email address');ok=false;}if(!ok)return;
  if(!document.getElementById('su_consent').checked){alert('Please accept the Terms & Privacy Policy to continue.');return;}
  const eu=document.getElementById('su_eu').checked;const btn=document.getElementById('subtn');btn.disabled=true;btn.textContent='Creating…';
  try{const s=await api('/account/save',{method:'POST',body:JSON.stringify({booking_token:S.booking_token,name,email,city:CITY,email_updates:eu?1:0,consent:1})});setSession(s.session,s.user);S.name=name;S.email=email;
    if(S.fromBooking){await placeOrder();}else{showProfile();}
  }catch(e){btn.disabled=false;btn.textContent='Create account →';alert(e.message);}}
async function showProfile(){if(!SESSION){enterFlow(loginPhone);return;}mode='page';stack=[];syncHeader();
  document.getElementById('view').innerHTML='<section class="block"><div class="container center" style="color:var(--ink-soft)">Loading your account…</div></section>';
  let u,orders=[];try{u=(await aapi('/account/me')).user;ME=u;syncAuth();}catch(e){clearSession();showHome();return;}
  try{orders=await aapi('/account/orders');}catch(e){}
  const oh=orders.length?orders.map(o=>`<div class="prow"><span class="oref">${o.ref}</span><span class="badge ${o.type}">${o.type}</span><span class="odev">${esc(o.device_label||'')}</span><span class="oamt">${INR(o.amount)}</span><span class="ost">${esc(o.status)}</span><button class="cta ghost-cta" onclick="trackRef('${o.ref}')">Track</button></div>`).join(''):'<p style="color:var(--ink-soft);font-size:14px">No orders yet — your bookings will show up here.</p>';
  document.getElementById('view').innerHTML=`<section class="block"><div class="container" style="max-width:740px">
    <div class="kicker" style="text-align:left">Your account</div><h2 style="text-align:left">Hi, ${esc(String(u.name||'there').trim().split(' ')[0])}</h2>
    <div class="form-card" style="margin-top:20px"><h3 class="pc-h">Profile & preferences</h3>
      <div class="form-grid">
        <div class="field" style="margin-top:0"><label>Full name</label><input id="p_name" value="${esc(u.name||'')}"></div>
        <div class="field" style="margin-top:0"><label>Email</label><input id="p_email" type="email" value="${esc(u.email||'')}"></div>
        <div class="field" style="margin-top:0"><label>Mobile</label>${u.phone?`<div class="ccrow"><input value="${esc(u.phone)}" disabled><button class="locbtn" style="margin:0;white-space:nowrap" onclick="enterFlow(addPhone)"><span>↻</span> Change</button></div>`:`<button class="locbtn" style="margin:0" onclick="enterFlow(addPhone)"><span>＋</span> Add your mobile number</button>`}</div>
        <div class="field" style="margin-top:0"><label>Preferred city</label><input id="p_city" value="${esc(u.city||CITY||'')}"></div>
      </div>
      <label class="prefrow" style="margin-top:14px"><input type="checkbox" id="p_eu" ${u.email_updates?'checked':''}> Email me updates about my orders</label>
      <div class="dock" style="margin-top:14px"><button class="btn green" onclick="saveProfile()">Save changes</button></div>
    </div>
    <div class="form-card" style="margin-top:18px"><h3 class="pc-h">Your orders</h3>${oh}</div>
    <div class="form-card" style="margin-top:18px"><h3 class="pc-h">Data &amp; privacy</h3>
      <p style="color:var(--ink-soft);font-size:13.5px;margin-bottom:12px">Download a copy of your data, or request deletion of your account. See our <a style="color:var(--green-bright)" onclick="showPolicy('privacy');return false" href="#">Privacy Policy</a>.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-ghost" onclick="downloadMyData()">Download my data</button><button class="btn btn-ghost" style="color:#C0392B;border-color:#E7B9B2" onclick="requestDelete()">Delete my account</button></div>
    </div>
    <div style="margin-top:18px"><button class="btn btn-ghost" onclick="logout()">Log out</button></div>
  </div></section>`+footerHTML();window.scrollTo({top:0});}
async function saveProfile(){clearErrs();const name=val('p_name'),email=val('p_email'),city=val('p_city');let ok=true;if(name.length<2){setErr('p_name','Please enter your name');ok=false;}if(!EMAIL_RE.test(email)){setErr('p_email','Enter a valid email');ok=false;}if(!ok)return;
  const eu=document.getElementById('p_eu').checked;
  try{const m=await aapi('/account/me',{method:'PUT',body:JSON.stringify({name,email,city,email_updates:eu?1:0})});setSession(SESSION,m.user);toast('Saved');}catch(e){alert(e.message);}}
async function logout(){try{await aapi('/account/logout',{method:'POST'});}catch(e){}clearSession();showHome();}
async function downloadMyData(){try{const r=await fetch(API+'/account/export',{headers:{'Authorization':'Bearer '+SESSION}});const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-data.json';a.click();URL.revokeObjectURL(a.href);}catch(e){alert('Could not export your data.');}}
async function requestDelete(){if(!confirm('Request deletion of your account and personal data? Our team will process this. You will be signed out.'))return;try{await aapi('/account/delete',{method:'POST',body:JSON.stringify({})});clearSession();alert('Your deletion request has been submitted. We will process it shortly.');showHome();}catch(e){alert(e.message||'Could not submit request.');}}
/* Cookie consent banner */
function mountCookie(){try{if(localStorage.getItem('cookie_ok'))return;}catch(e){}
  if(document.getElementById('cookieBar'))return;
  const d=document.createElement('div');d.id='cookieBar';d.className='cookiebar';
  d.innerHTML=`<span>We use essential cookies to run this site and improve your experience. See our <a onclick="showPolicy('privacy');return false" href="#">Privacy Policy</a>.</span><button class="cta green" onclick="acceptCookies()">Got it</button>`;
  document.body.appendChild(d);
}
function acceptCookies(){try{localStorage.setItem('cookie_ok','1');}catch(e){}const b=document.getElementById('cookieBar');if(b)b.remove();}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},1600);}
function loadGsi(){return new Promise(res=>{const ok=()=>window.google&&google.accounts&&google.accounts.id;if(ok())return res();let s=document.getElementById('gsi');if(!s){s=document.createElement('script');s.id='gsi';s.src='https://accounts.google.com/gsi/client';s.async=true;document.head.appendChild(s);}const iv=setInterval(()=>{if(ok()){clearInterval(iv);res();}},80);setTimeout(()=>{clearInterval(iv);res();},5000);});}
function mountGoogleIfPresent(){const el=document.getElementById('gbtn');if(!el||el.dataset.done)return;const sec=document.getElementById('gsection');const cid=(SET.google_client_id||'').trim();
  if(!cid){if(sec)sec.remove();return;}            // not configured → phone only
  el.dataset.done='1';
  const fail=msg=>{console.error('[Google sign-in]',msg);const w=el.closest('.gwrap');if(w)w.innerHTML='<div class="gnote">Google sign-in is unavailable right now — please use your phone below.</div>';};
  console.info('[Google sign-in] If the button shows but clicking does nothing, add '+location.origin+' to "Authorized JavaScript origins" for this client ID in Google Cloud Console.');
  loadGsi().then(()=>{
    if(!(window.google&&google.accounts&&google.accounts.id)){fail('GIS library failed to load (offline, blocked, or CSP).');return;}
    try{
      google.accounts.id.initialize({client_id:cid,callback:onGoogleCredential,error_callback:e=>console.error('[Google sign-in]',(e&&e.type)||e)});
      google.accounts.id.renderButton(el,{theme:'outline',size:'large',text:S.authMode==='signup'?'signup_with':'continue_with',shape:'pill',width:300});
    }catch(e){fail((e&&e.message)||String(e));}
  });
}
async function onGoogleCredential(resp){try{const r=await api('/account/google',{method:'POST',body:JSON.stringify({credential:resp.credential})});setSession(r.session,r.user);if(S.fromBooking){await placeOrder();}else{showProfile();}}catch(e){alert(e.message||'Google sign-in failed');}}

const capId=s=>String(s||'').charAt(0).toUpperCase()+String(s||'').slice(1);
async function renderMyOrders(){const el=document.getElementById('heroRight');if(!el)return;
  if(!ME||!SESSION){el.innerHTML=heroArtHTML();return;}
  let orders=[];try{orders=await aapi('/account/orders');}catch(e){el.innerHTML=heroArtHTML();return;}
  if(!orders.length){el.innerHTML=heroArtHTML();return;}
  const latest=orders.slice(0,3);
  const cards=latest.map(o=>{const flow=flowSteps(o.type).map(s=>s.key);const idx=Math.max(0,flow.indexOf(o.status));const pct=flow.length?Math.round((idx+1)/flow.length*100):0;
    return `<div class="hocard" onclick="trackRef('${o.ref}')" role="button" tabindex="0">
      <div class="hocard-top"><span class="hocard-dev">${esc(o.device_label||'Your device')}</span><span class="badge ${o.type}">${o.type==='repair'?'Repair':'Sell'}</span></div>
      <div class="hocard-bar"><span style="width:${pct}%"></span></div>
      <div class="hocard-foot">${badge(o.type,o.status)}<span class="hocard-amt">${INR(o.amount)}</span></div>
    </div>`;}).join('');
  el.innerHTML=`<div class="hero-orders"><div class="ho-head"><b>Welcome back, ${esc(first(ME.name))}</b><span onclick="showProfile()">${orders.length>3?`All (${orders.length})`:'Account'}</span></div><div class="ho-sub">Your recent orders</div>${cards}</div>`;
}

function applyBranding(){
  const bn=SET.brand_name||'ReGear';
  document.getElementById('brandName').textContent=bn;
  if(SET.cities){const a=SET.cities.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);if(a.length)CITIES=a;}
  document.getElementById('city').textContent=CITY||SET.city||'Bengaluru';

          ${(c.emailOtp&&!c.emailV)?`<div class="vrow" style="margin-top:6px"><input id="c_email_code" inputmode="numeric" maxlength="6" placeholder="6-digit email code">${c.emailDev?`<span class="vhint">demo ${esc(c.emailDev)}</span>`:''}<button type="button" class="btn green vbtn" onclick="corpConfirmEmail()">Confirm</button></div>`:''}

async function submitCorp(){
  corpCapture();const c=S.corp;const company=(c.company||'').trim();
  if(company.length<2){alert('Please enter your company name');return;}
  if(!c.emailV){c.emailMsg='Verify your work email to continue';showCorporate();return;}
  if(!c.phoneV){c.phoneMsg='Verify your phone to continue';showCorporate();return;}
  const btn=document.getElementById('cbtn2');btn.textContent='Sending…';btn.disabled=true;
  try{
    const r=await api('/corporate',{method:'POST',body:JSON.stringify({intent:corpIntent,company,contact_name:c.name||'',email:c.email,phone:c.phone,device_types:c.types||'',quantity:+(c.qty)||null,message:c.msg||'',email_token:c.emailToken,phone_token:c.phoneToken})});
    S.corp={};
    document.getElementById('view').innerHTML=`<section class="block"><div class="container center"><div class="tick">✓</div><h2>Request received</h2><p class="lead">Thanks — our corporate team will reach out within one business day. Your reference is <b>${r.ref}</b>.</p><button class="cta green" style="margin-top:22px" onclick="showHome()">Back to home</button></div></section>`+footerHTML();
    window.scrollTo({top:0});

}

/* ---------------- FLOW ---------------- */
function freshS(extra){const s=Object.assign({},extra);if(ME){if(ME.name)s.name=ME.name;if(ME.email)s.email=ME.email;if(ME.phone)s.phone=ME.phone;}return s;}
function startFix(){S=freshS({mode:'fix',issues:[]});enterFlow(pickCat);}
function startSell(){S=freshS({mode:'sell',answers:{},qi:0});enterFlow(pickCat);}
function startCat(id){S=freshS({cat:id});enterFlow(choosePurpose);}
function enterFlow(fn){mode='flow';stack=[fn];syncHeader();renderFlow();}
function nav(fn){stack.push(fn);renderFlow();}
function goBack(){if(mode!=='flow')return;if(stack.length>1){stack.pop();renderFlow();}else showHome();}
async function renderFlow(){
  const v=document.getElementById('view');syncHeader();
  v.innerHTML='<div class="flowwrap center" style="color:var(--ink-soft)">…</div>';
  const body=await stack[stack.length-1]();
  v.innerHTML='<div class="flowwrap"><div class="flow-back" onclick="goBack()">← Back</div>'+body+'</div>';
  if(typeof mountGoogleIfPresent==='function')mountGoogleIfPresent();
  window.scrollTo({top:0});
}
function prog(n){let s='';for(let i=0;i<5;i++)s+=`<i class="${i<n?'on':''}"></i>`;return `<div class="prog">${s}</div>`;}

function choosePurpose(){const c=cat(S.cat);const canFix=flowOK(c,'fix'),canSell=flowOK(c,'sell');
  const fixRow=`<div class="row" onclick="S.mode='fix';S.issues=[];nav(pickBrand)"><span class="em">🛠️</span><div class="meta"><b>Repair it</b><span>Book a repair with a transparent quote</span></div><span class="chev">→</span></div>`;
  const sellRow=`<div class="row" onclick="S.mode='sell';S.answers={};S.qi=0;nav(pickBrand)"><span class="em">💸</span><div class="meta"><b>Sell it</b><span>Get an instant price and free pickup</span></div><span class="chev">→</span></div>`;
  return `<div class="eyebrow">${esc(c.name)}</div><div class="step-h">${canFix&&canSell?'Fix it or sell it?':(canFix?'Repair your device':'Sell your device')}</div><p class="fsub">What would you like to do with your ${esc(c.name.toLowerCase())}?</p>
  <div class="list">${canFix?fixRow:''}${canSell?sellRow:''}${!canFix&&!canSell?`<div class="muted-card">This device type isn't available right now.</div>`:''}</div>`;}
function curCity(){return CITY||SET.city||'Bengaluru';}
function inCity(item,mode){if(SET.city_catalog!=='1')return true;const list=(mode==='fix'?item.repair_cities:item.sell_cities)||[];return list.includes(curCity());}
function flowOK(item,mode){return (mode==='fix'?item.for_repair:item.for_sell)&&inCity(item,mode);}
function catAvailable(c){return flowOK(c,'fix')||flowOK(c,'sell');}
function catsForFlow(mode){return CATALOG.filter(c=>flowOK(c,mode));}
function pickCat(){const list=catsForFlow(S.mode);return prog(1)+`<div class="eyebrow">${S.mode==='fix'?'Repair':'Sell'} · Step 1</div><div class="step-h">What kind of device?</div>
  ${list.length?`<div class="grid2">${list.map(c=>`<div class="tile" onclick="S.cat=${c.id};nav(pickBrand)"><span class="em">${catEmoji(c)}</span>${esc(c.name)}</div>`).join('')}</div>`:`<div class="muted-card">No device types are available for ${S.mode==='fix'?'repair':'resale'} right now.</div>`}`;}
function pickBrand(){const c=cat(S.cat);const brands=c.brands.filter(b=>flowOK(b,S.mode));return prog(2)+`<div class="eyebrow">${esc(c.name)}</div><div class="step-h">Pick the brand</div>
  ${brands.length?`<div class="grid2">${brands.map(b=>`<div class="tile brand" onclick="S.brand=${b.id};nav(pickModel)">${esc(b.name)}</div>`).join('')}</div>`:`<div class="muted-card">No brands are available for ${S.mode==='fix'?'repair':'resale'} in this category yet.</div>`}`;}
function pickModel(){const c=cat(S.cat);const b=c.brands.find(x=>x.id===S.brand);const models=b.models.filter(m=>flowOK(m,S.mode));return prog(3)+`<div class="eyebrow">${esc(b.name)} ${esc(c.name)}</div><div class="step-h">Which model?</div>
  ${models.length?`<div class="list">${models.map(m=>`<div class="row" onclick="S.model=${m.id};S.modelName='${m.name.replace(/'/g,'')}';S.base=${m.base_value};nav(${S.mode==='fix'?'pickIssues':'condition'})"><span class="em">${catEmoji(c)}</span><div class="meta"><b>${esc(m.name)}</b><span>${S.mode==='sell'?'Up to '+INR(m.base_value):'Tap to select issues'}</span></div><span class="chev">→</span></div>`).join('')}</div>`:`<div class="muted-card">No models are available for ${S.mode==='fix'?'repair':'resale'} under this brand yet.</div>`}`;}
function devStrip(){const c=cat(S.cat);const b=c.brands.find(x=>x.id===S.brand);return `<div class="selected-device"><span class="em">${catEmoji(c)}</span><div><b>${esc(b.name)} ${esc(S.modelName)}</b><span>${esc(c.name)}</span></div><span class="edit" onclick="while(stack[stack.length-1]!==pickModel&&stack.length>1)stack.pop();renderFlow()">change</span></div>`;}

async function pickIssues(){S.issueList=(await api('/models/'+S.model+'/repair-issues')).filter(it=>it.applies);
  return prog(4)+devStrip()+`<div class="step-h">What's wrong?</div><p class="fsub">Select all that apply. Final price confirmed after free diagnosis.</p>
  <div class="list">${S.issueList.length?S.issueList.map(it=>{const sel=S.issues.includes(it.issue_id);return `<div class="opt ${sel?'sel':''}" onclick="togIssue(${it.issue_id})"><div class="check">✓</div><div class="meta"><b>${esc(it.name)}</b><span>ETA ${esc(it.eta)}</span></div><span class="price">${INR(it.price)}</span></div>`;}).join(''):`<div class="muted-card">No repair options are listed for this model yet — please use “Track order” help or contact us and we’ll assist.</div>`}</div>
  <div class="dock"><button class="btn green" ${S.issues.length?'':'disabled'} onclick="nav(pickMode)">Choose service ${S.issues.length?`<span class="pill">${S.issues.length}</span>`:''}</button></div>`;}
function togIssue(id){const k=S.issues.indexOf(id);if(k>=0)S.issues.splice(k,1);else S.issues.push(id);renderFlow();}
function pickMode(){if(!S.svc)S.svc='pickup';return prog(5)+devStrip()+`<div class="step-h">How do you want it done?</div>
  <div class="modes">${MODES.map(m=>`<div class="mode ${S.svc===m[0]?'sel':''}" onclick="S.svc='${m[0]}';renderFlow()"><span class="em">${m[1]}</span><div class="meta"><b>${m[2]}</b><span>${m[3]}</span></div><span class="tag">${m[4]}</span></div>`).join('')}</div>
  <div class="dock"><button class="btn green" onclick="nav(fixQuote)">See my quote →</button></div>`;}
async function fixQuote(){const q=await api('/quotes/repair',{method:'POST',body:JSON.stringify({model_id:S.model,issue_ids:S.issues})});S.amount=q.total;S.quote=q;
  return devStrip()+`<div class="eyebrow">Estimated quote</div><div class="step-h">Your repair estimate</div>
  <div class="quote">${q.items.map(p=>`<div class="qrow"><span>${esc(p.name)}</span><b>${INR(p.price)}</b></div>`).join('')}<div class="qrow"><span>GST (${q.gst_percent}%)</span><b>${INR(q.gst)}</b></div><div class="qrow"><span>${MODES.find(m=>m[0]===S.svc)[2]}</span><b style="color:var(--green)">Free</b></div><div class="qrow tot"><span>Estimated total</span><b>${INR(q.total)}</b></div></div>
  <div class="muted-card">🛡️ 12-month warranty on parts & labour. You approve the final price after a free diagnosis.</div>
  <div class="dock"><button class="btn green" onclick="nav(schedule)">Book this repair →</button></div>`;}
function condition(){const cur=CONDITIONS[S.qi];return prog(4)+devStrip()+`<div class="eyebrow">Condition · ${S.qi+1} of ${CONDITIONS.length}</div><div class="step-h">${esc(cur.name)}</div>
  <div class="list" style="margin-top:14px">${cur.options.map(o=>`<div class="opt" onclick="answer(${cur.id},${o.id})"><div class="check">✓</div><div class="meta"><b>${esc(o.label)}</b></div></div>`).join('')}</div>
  <p class="note">Honest answers = an accurate quote. We verify at pickup before paying.</p>`;}
function answer(gid,oid){S.answers[gid]=oid;if(S.qi<CONDITIONS.length-1){S.qi++;renderFlow();}else nav(sellQuote);}
function condSummary(){return CONDITIONS.map(g=>{const oid=S.answers[g.id];const o=(g.options||[]).find(x=>x.id===oid);return o?{q:g.name,a:o.label,factor:o.factor}:null;}).filter(Boolean);}
async function sellQuote(){const q=await api('/quotes/sell',{method:'POST',body:JSON.stringify({model_id:S.model,answers:S.answers})});S.amount=q.payout;S.quote=q;
  return devStrip()+`<div class="center"><div class="eyebrow">Your instant quote</div></div>
  <div class="estimate-card"><div style="font-size:13px;color:var(--ink-soft);font-weight:600">We'll pay you up to</div><div class="big-price amber">${INR(q.payout)}</div><div style="font-size:13px;color:var(--ink-soft)">Locked for 48 hrs · paid at pickup</div></div>
  <div class="eyebrow" style="margin-top:22px">Based on your answers<span style="float:right;color:var(--green);cursor:pointer;font-weight:600;text-transform:none;letter-spacing:0" onclick="S.qi=0;nav(condition)">Edit</span></div>
  <div class="list">${condSummary().map(s=>`<div class="row" style="cursor:default"><span class="em">✓</span><div class="meta"><span>${esc(s.q)}</span><b>${esc(s.a)}</b></div></div>`).join('')}</div>
  <div class="list" style="margin-top:20px"><div class="row" style="cursor:default"><span class="em">⚡</span><div class="meta"><b>Instant payment</b><span>UPI / bank transfer on collection</span></div></div><div class="row" style="cursor:default"><span class="em">🚚</span><div class="meta"><b>Free doorstep pickup</b><span>Same-day slots in ${esc(SET.city||'your city')}</span></div></div><div class="row" style="cursor:default"><span class="em">🔒</span><div class="meta"><b>Data wiped securely</b><span>Certified erasure in front of you</span></div></div></div>
  <div class="dock"><button class="btn amber" onclick="nav(schedule)">Sell it · schedule pickup →</button></div>`;}
function schedule(){const fix=S.mode==='fix';return `<div class="step-h">${fix?'Where & when?':'Pickup details'}</div><p class="fsub">${fix?'Our technician arrives at your slot.':'We collect & pay at this slot.'}</p>
  <div class="field"><label>Full name</label><input id="f_name" placeholder="e.g. Aarav Sharma" value="${esc(S.name||'')}"></div>
  <div class="field"><label>Mobile number</label><div class="ccrow"><select id="f_cc" class="cc">${ccOptions(S.dial)}</select><input id="f_phone" placeholder="10-digit mobile" inputmode="tel" value="${esc(S.phone||'')}"></div></div>
  <div class="field"><label>Email (for order updates)</label><input id="f_email" type="email" placeholder="you@email.com" value="${esc(S.email||'')}"></div>
  <div class="field"><label>City</label><select id="f_city">${CITIES.map(c=>`<option ${c===(S.city||curCity())?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
  <div class="field"><label>Address</label><button type="button" class="locbtn" id="locBtn" onclick="useLocation('locBtn','f_addr')"><span>📍</span> Use my current location</button><textarea id="f_addr" rows="2" placeholder="Flat, street, area, city, pincode">${esc(S.address||'')}</textarea></div>
  <div class="field" id="slotField"><label>Pick a slot</label><div class="slots">${SLOTS.map((s,i)=>`<div class="slot ${S.slot===s?'sel':''}" id="sl${i}" onclick="selSlot(${i})">${s}</div>`).join('')}</div></div>
  <label class="prefrow" id="consentRow" style="margin-top:6px"><input type="checkbox" id="f_consent" ${S.consent?'checked':''}> I agree to the <a onclick="showPolicy('terms');return false" href="#">Terms</a> &amp; <a onclick="showPolicy('privacy');return false" href="#">Privacy Policy</a></label>
  <div class="dock"><button class="btn ${fix?'green':'amber'}" id="cbtn" onclick="startOtp()">Continue to verify →</button><p class="note">We'll text a one-time code to confirm your number.</p></div>`;}
function selSlot(i){S.slot=SLOTS[i];document.querySelectorAll('.slot').forEach(s=>s.classList.remove('sel'));document.getElementById('sl'+i).classList.add('sel');fieldErr(document.getElementById('slotField'),'');}
function startOtp(){
  clearErrs();
  S.name=val('f_name');S.dial=val('f_cc')||'+91';S.phone=val('f_phone');S.email=val('f_email');S.address=val('f_addr');S.city=val('f_city')||curCity();
  let ok=true;
  if(S.name.length<2){setErr('f_name','Please enter your name');ok=false;}
  const digits=S.phone.replace(/\D/g,'');const minLen=S.dial==='+91'?10:7;
  if(digits.length<minLen){setErr('f_phone','Enter a valid mobile number');ok=false;}
  if(!EMAIL_RE.test(S.email)){setErr('f_email','Enter a valid email address');ok=false;}
  if(S.address.length<8){setErr('f_addr','Please enter your full address');ok=false;}
  if(!S.slot){fieldErr(document.getElementById('slotField'),'Please pick a slot');ok=false;}
  S.consent=document.getElementById('f_consent')&&document.getElementById('f_consent').checked;
  if(!S.consent){const cr=document.getElementById('consentRow');if(cr)cr.style.color='#C0392B';ok=false;}
  if(!ok)return;
  sendOtp(true);
}
/* OTP — fully backend-owned (routes/otp.js). To send real SMS later, plug a
   provider into deliver() in that file; no frontend change needed. */
async function sendOtp(advance){
  try{const r=await otpSend();S.devCode=r.dev_code||'';S.otpMsg=advance?'':'A new code has been sent';if(advance)nav(otpScreen);else renderFlow();}
  catch(e){alert(e.message);}
}
async function verifyOtp(){
  const code=((document.getElementById('otp_code')||{}).value||'').trim();
  if(code.length<4)return alert('Enter the code');
  const btn=document.getElementById('vbtn');btn.textContent='Verifying…';btn.disabled=true;
  try{const r=await otpVerify(code);S.booking_token=r.token;
    if(ME&&SESSION){try{const m=await aapi('/account/attach-phone',{method:'POST',body:JSON.stringify({booking_token:S.booking_token})});ME=m.user;syncAuth();}catch(e){}await placeOrder();}
    else{const a=await api('/account/resolve',{method:'POST',body:JSON.stringify({booking_token:S.booking_token})});
      if(a.exists){const s=await api('/account/save',{method:'POST',body:JSON.stringify({booking_token:S.booking_token,name:S.name,email:S.email,city:CITY})});setSession(s.session,s.user);await placeOrder();}
      else{S.fromBooking=true;nav(loginSignup);}}
  }
  catch(e){btn.disabled=false;btn.textContent='Verify';alert(e.message);}
}
function otpScreen(){const fix=S.mode==='fix';return `<div class="step-h">Verify your number</div><p class="fsub">Enter the 6-digit code we sent to <b>${esc(S.phone)}</b>.</p>
  ${S.devCode?`<div class="muted-card" style="border-color:rgba(20,49,92,.3);color:var(--green)">Use code <b style="font-family:'JetBrains Mono'">${S.devCode}</b> to continue. (In production this arrives by SMS.)</div>`:''}
  <div class="field"><label>One-time code</label><input id="otp_code" inputmode="numeric" maxlength="6" placeholder="––––––" style="letter-spacing:8px;text-align:center;font-family:'JetBrains Mono';font-size:22px"></div>
  <div class="dock"><button class="btn ${fix?'green':'amber'}" id="vbtn" onclick="verifyOtp()">Verify &amp; ${fix?'book repair':'confirm pickup'}</button>
  <button class="btn btn-ghost" onclick="sendOtp(false)">Resend code</button>${S.otpMsg?`<p class="note">${S.otpMsg}</p>`:''}</div>`;}
async function placeOrder(){
  const c=cat(S.cat);const b=c.brands.find(x=>x.id===S.brand);
  try{const o=await api('/orders',{method:'POST',body:JSON.stringify({type:(S.mode==='fix'?'repair':'sell'),model_id:S.model,device_label:`${b.name} ${S.modelName}`,details:S.mode==='fix'?{issues:S.issues,service_mode:S.svc,items:(S.quote&&S.quote.items)||[],gst_percent:S.quote&&S.quote.gst_percent,gst:S.quote&&S.quote.gst,total:S.quote&&S.quote.total}:{answers:S.answers,base_value:S.quote&&S.quote.base_value,payout:S.quote&&S.quote.payout,summary:condSummary()},amount:S.amount,service_mode:S.svc,customer_name:S.name,customer_phone:S.phone,customer_email:S.email,address:S.address,slot:S.slot,city:S.city||curCity(),booking_token:S.booking_token})});S.order=o.ref;nav(done);}
  catch(e){alert('Could not place order: '+e.message);const vb=document.getElementById('vbtn');if(vb){vb.disabled=false;vb.textContent='Verify';}}
}
function done(){const fix=S.mode==='fix';return `<div class="center"><div class="tick ${fix?'':'amber'}">✓</div><h1 style="font-size:30px">${fix?'Repair booked!':'Pickup scheduled!'}</h1><p class="fsub">${fix?'A technician is assigned for':'Our agent will collect your device'} <b style="color:var(--ink)">${S.slot}</b>.</p><div class="oid">Order ${S.order}</div>

async function trackRef(ref){try{S.tracked=await api('/orders/'+ref);}catch(e){alert('Order not found');return;}

function track(){const o=S.tracked;const fix=o.type==='repair';const steps=flowSteps(o.type);const flow=steps.map(s=>s.key);
  const tmap={};(S.templates||[]).forEach(t=>tmap[t.key]=t);const cur=Math.max(0,flow.indexOf(o.status));
  const fill=s=>String(s||'').replace(/{name}/g,o.customer_name||'there').replace(/{ref}/g,o.ref).replace(/{device}/g,o.device_label||'your device').replace(/{amount}/g,INR(o.amount)).replace(/{status}/g,statInfo(o.type,o.status).label||o.status);
  return `<div class="step-h">Order ${o.ref}</div><p class="fsub">${fix?'Repair status':'Resale pickup status'} · ${esc(o.device_label)} &nbsp;${badge(o.type,o.status)}</p>

  }).join('')||`<div class="cmt sys"><span>No messages yet.</span></div>`;

  const composer=canPost?`
    <div class="composer">

const MAX_FILE=7*1024*1024;
function pickFiles(input){
  const out=[];const hint=document.getElementById('filehint');document.getElementById('cmt_err').textContent='';
  const files=[...input.files].slice(0,5);let pending=files.length;if(!pending){S.files=[];hint.textContent='';return;}
  files.forEach(f=>{
    if(!(/^image\//.test(f.type)||f.type==='application/pdf')){document.getElementById('cmt_err').textContent='Only images and PDF files are allowed.';pending--;return;}
    if(f.size>MAX_FILE){document.getElementById('cmt_err').textContent='“'+f.name+'” is over 7MB.';pending--;return;}
    const r=new FileReader();r.onload=()=>{out.push({name:f.name,mime:f.type,data:r.result});if(--pending<=0){S.files=out;hint.textContent=out.length+' file(s) attached';}};
    r.onerror=()=>{pending--;};r.readAsDataURL(f);
  });
}
async function postComment(ref){

  const body={id_type:val('k_type'),id_number:val('k_idnum'),serial:val('k_serial'),consent_name:val('k_name')};
  if(cb)body.consent=cb.checked?1:0;
  const qcEls=document.querySelectorAll('input[data-qc]');
  if(qcEls.length)body.qc=JSON.stringify([...qcEls].filter(x=>x.checked).map(x=>x.value));
  if(S.kycFile)body.doc=S.kycFile;
  S.kyc=await aapi('/service/orders/'+ref+'/kyc',{method:'PUT',body:JSON.stringify(body)});S.kycFile=null;return S.kyc;
}
async function saveKyc(ref){const err=document.getElementById('kyc_err');err.textContent='';
  try{await persistKyc(ref);toast('KYC saved');renderFlow();}
  catch(e){err.textContent=e.message;}}
async function viewKyc(ref){try{const r=await fetch(API+'/service/orders/'+ref+'/kyc/doc',{headers:{Authorization:'Bearer '+SESSION}});if(!r.ok)throw 0;const blob=await r.blob();const url=URL.createObjectURL(blob);const bn=SET.brand_name||'ByteFix';
  if(blob.type.indexOf('pdf')>=0){window.open(url,'_blank');return;}
  const wm='<span>'+esc(bn)+' • VERIFICATION ONLY</span>';
  const w=window.open('','_blank');if(!w){window.open(url,'_blank');return;}
  w.document.write(`<!doctype html><title>ID — ${esc(ref)}</title><style>body{margin:0;background:#222;display:grid;place-items:center;min-height:100vh}.idwrap{position:relative;display:inline-block}.idimg{max-width:96vw;max-height:96vh;display:block}.idwm{position:absolute;inset:0;display:flex;flex-direction:column;gap:30px;align-items:center;justify-content:center;transform:rotate(-24deg);pointer-events:none}.idwm span{color:rgba(255,80,60,.55);font-family:Arial;font-weight:800;font-size:22px;white-space:nowrap;letter-spacing:.05em}</style><div class="idwrap"><img class="idimg" src="${url}"><div class="idwm">${wm}${wm}${wm}${wm}${wm}</div></div>`);w.document.close();
}catch(e){alert('Could not load the document.');}}
async function kycSendOtp(ref){const h=document.getElementById('kyc_otp_hint');h.textContent='Sending…';try{const r=await aapi('/service/orders/'+ref+'/kyc/send-otp',{method:'POST',body:JSON.stringify({})});h.textContent='OTP sent to ••••'+(r.phone_last4||'')+(r.dev_code?(' (demo code '+r.dev_code+')'):'');}catch(e){h.textContent=e.message;}}
async function kycSign(ref){const code=val('k_otp');const h=document.getElementById('kyc_otp_hint');if(!code){h.textContent='Enter the OTP the seller received';return;}try{await persistKyc(ref);S.kyc=await aapi('/service/orders/'+ref+'/kyc/sign',{method:'POST',body:JSON.stringify({code})});toast('Consent signed via OTP');renderFlow();}catch(e){h.textContent=e.message;}}
function maskId(type,num){num=String(num||'').trim();if(!num)return '—';if(/aadh/i.test(type||'')){const d=num.replace(/\D/g,'');return d.length>4?('XXXX XXXX '+d.slice(-4)):num;}return num;}
async function genKycDoc(ref){try{await persistKyc(ref);}catch(e){}const o=S.tracked,k=S.kyc||{};const bn=SET.brand_name||'ByteFix';
  let docHtml='';
  if(k.has_doc){try{const r=await fetch(API+'/service/orders/'+ref+'/kyc/doc',{headers:{Authorization:'Bearer '+SESSION}});const blob=await r.blob();const data=await new Promise(rs=>{const fr=new FileReader();fr.onload=()=>rs(fr.result);fr.readAsDataURL(blob);});const wm='<span>'+esc(bn)+' • VERIFICATION ONLY</span>';docHtml=blob.type.indexOf('pdf')>=0?`<embed src="${data}" type="application/pdf" style="width:100%;height:560px;border:1px solid #ccc">`:`<div class="idwrap"><img class="idimg" src="${data}"><div class="idwm">${wm}${wm}${wm}${wm}</div></div>`;}catch(e){}}
  const row=(l,v)=>`<tr><td class="lbl">${l}</td><td>${esc(v||'—')}</td></tr>`;
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>Ownership Declaration ${esc(o.ref)}</title>
   <style>body{font-family:Arial,Helvetica,sans-serif;color:#111;max-width:720px;margin:24px auto;padding:0 22px;line-height:1.55}h1{font-size:20px;margin:0}table{width:100%;border-collapse:collapse;margin:16px 0}td{padding:8px 10px;border:1px solid #ccd;font-size:14px}.lbl{background:#f3f5f8;font-weight:bold;width:38%}.muted{color:#666;font-size:12px}.sig{margin-top:54px;display:flex;justify-content:space-between;gap:30px}.sig div{flex:1;border-top:1px solid #333;padding-top:6px;font-size:13px}.idwrap{position:relative;display:inline-block;margin-top:6px}.idimg{max-width:340px;border:1px solid #ccc;border-radius:8px;display:block}.idwm{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;transform:rotate(-24deg);pointer-events:none}.idwm span{color:rgba(192,57,43,.5);font-weight:800;font-size:13px;white-space:nowrap;letter-spacing:.04em}</style></head>
   <body>
   <h1>${esc(bn)} — Device Sale &amp; Ownership Declaration</h1>
   <p class="muted">Reference: ${esc(o.ref)} &nbsp;·&nbsp; Generated: ${new Date().toLocaleString('en-IN')}</p>
   ${k.verified?`<div style="border:2px solid #2E7D32;background:#E7F4EA;color:#1b5e20;padding:10px 14px;border-radius:8px;font-weight:bold;margin:14px 0">✓ VERIFIED by ${esc(bn)}${(k.verified_name||k.verified_username)?(' · '+esc(k.verified_name||k.verified_username)):''}${k.verified_at?(' · '+new Date(k.verified_at).toLocaleString('en-IN')):''}</div>`:`<div style="border:2px solid #C0392B;background:#FCEBE9;color:#922;padding:10px 14px;border-radius:8px;font-weight:bold;margin:14px 0">NOT VERIFIED — this document is NOT valid until verified by ${esc(bn)}.</div>`}
   <table>
     ${row('Seller name',k.consent_name||o.customer_name)}
     ${row('Contact',(o.customer_phone||'')+'  '+(o.customer_email||''))}
     ${row('ID',(k.id_type||'')+': '+maskId(k.id_type,k.id_number||k.id_last4||''))}
     ${row('Device',o.device_label)}
     ${row('Serial / IMEI',k.serial)}
     ${row('City',o.city)}
     ${row('Agreed amount',INR(o.amount))}
     ${row('Processed by (operator)',k.operator_name||k.operator_username)}
   </table>
   <p><b>Declaration:</b> I, the seller named above, confirm that I am the rightful owner of the device described, that it is not lost, stolen, or under any legal encumbrance, and that I voluntarily sell it to ${esc(bn)}. I consent to the collection of my identity document for KYC and record-keeping as required by applicable law.</p>
   <p class="muted">${k.consent_method==='otp'?('Digitally signed via OTP to phone &bull;&bull;&bull;&bull;'+esc((k.signed_phone||'').slice(-4))+' &middot; '+esc(k.sign_ref||'')+(k.consent_at?(' &middot; '+new Date(k.consent_at).toLocaleString('en-IN')):'')):('Digital consent captured: '+(k.consent?'YES':'NO')+(k.consent_at?(' &middot; '+new Date(k.consent_at).toLocaleString('en-IN')):''))}</p>
   ${docHtml?('<p><b>ID document on file:</b></p>'+docHtml):''}
   <div class="sig"><div>Seller signature</div><div>For ${esc(bn)} (operator)</div></div>
   <scr`+`ipt>window.onload=function(){setTimeout(function(){window.print();},400);}</scr`+`ipt>
   </body></html>`;
  const w=window.open('','_blank');if(!w){alert('Please allow pop-ups to generate the document.');return;}
  w.document.write(html);w.document.close();
}
async function opSetStatus(ref,status){
  try{const o=await aapi('/service/orders/'+ref+'/status',{method:'PUT',body:JSON.stringify({status})});S.tracked=o;
    S.thread=await api('/service/orders/'+ref+'/thread');toast('Status → '+statInfo(o.type,status).label);renderFlow();
  }catch(e){alert(e.message);}
}

/* ---------------- AI chat assistant ---------------- */
let chatHist=[],chatOpen=false;
function mountChat(){
  if(document.getElementById('aiChat'))return;
  const w=document.createElement('div');w.id='aiChat';w.className='aichat';
  w.innerHTML=`<button class="aichat-bubble" onclick="toggleChat()" aria-label="Chat with us">💬</button>
    <div class="aichat-panel">
      <div class="aichat-head"><span><b>Assistant</b><small>Repairs · selling · orders</small></span><button onclick="toggleChat()" aria-label="Close">✕</button></div>
      <div class="aichat-msgs" id="aiMsgs"></div>
      <form class="aichat-in" onsubmit="sendChat(event)"><input id="aiText" placeholder="Type your question…" autocomplete="off" maxlength="1000"><button class="cta green" type="submit">Send</button></form>
    </div>`;
  document.body.appendChild(w);
  pushChat('assistant',`Hi! I'm the ${esc(SET.brand_name||'ByteFix')} assistant. Ask me about repairs, selling your device, pricing, or tracking an order.`);
}
function toggleChat(){chatOpen=!chatOpen;document.getElementById('aiChat').classList.toggle('open',chatOpen);if(chatOpen)setTimeout(()=>document.getElementById('aiText')?.focus(),60);}
function pushChat(role,text){chatHist.push({role,content:text});const box=document.getElementById('aiMsgs');if(!box)return;const d=document.createElement('div');d.className='aimsg '+role;d.innerHTML=esc(text).replace(/\n/g,'<br>');box.appendChild(d);box.scrollTop=box.scrollHeight;}
async function sendChat(e){if(e)e.preventDefault();const inp=document.getElementById('aiText');const msg=(inp.value||'').trim();if(!msg)return;inp.value='';pushChat('user',msg);
  const box=document.getElementById('aiMsgs');const t=document.createElement('div');t.className='aimsg assistant typing';t.textContent='…';box.appendChild(t);box.scrollTop=box.scrollHeight;
  try{const r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,history:chatHist.slice(-9,-1)})});const d=await r.json();t.remove();pushChat('assistant',d.reply||d.error||'Sorry, please try again.');}
  catch(err){t.remove();pushChat('assistant','Sorry, I could not reach the server. Please try again.');}
}

boot();mountChat();mountCookie();
